guidance:
  status: agreed
  use:
    - |-
      Marking the status of something in a list, a card or a table row: Paid, Overdue, Draft.
    - |-
      `Small` when there's no room for words, or the status is obvious from where it sits. Just the coloured dot.
  avoid:
    - Telling people something about the whole page. That's **InlineBanner**.
    - Describing what something is about rather than its status. That's **Tag**.
    - Anything clickable. Badge doesn't do hover or focus, **Chip** does.
  behaviour: |-
    Two sizes now. `Small` is only the dot, 24 by 24, coloured by `status`. `Medium` is the label with an outline, and `status` changes only the outline (`non-interactive/background/<status>/light`). The text stays `non-interactive/foreground/tertiary` whatever the status, on purpose: I keep badges quiet. There's no background fill either. My first Badge in the accounting app got exactly that wrong. The dot in front of the label is optional now (`showIcon`), and off unless you ask for it.
  accessibility:
    element: a `<span>`. Nothing to click, nothing to focus.
    name: |-
      on `Medium`, the label. On `Small` there is no text, so pass `aria-label` and it becomes the dot's alt text.
    keyboard: none. It isn't interactive.
    colour: |-
      the colour alone isn't enough. On `Medium` the text says the status. On `Small` there's no text, so give it an `aria-label` ("Overdue") or put the status in words right next to it.
    dot: "`aria-hidden=\"true\"` when there's a label next to it."
  content: One or two words. Sentence case, no punctuation.
