# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: effect-floating
name: Floating
kind: effect
status: review
summary: The only drop shadow in the kit, for things that float above the page.
category: effects
related: [ effect-menu ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "231:2"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=231-2
  extractedAt: "2026-08-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
elements:
  root:
    notes: |-
      Whatever the style is applied to. In Figma it's called "Shadow/Floating".
    styles:
      box-shadow:
        value: 0px 16px 24px 0px rgba(0, 0, 0, 0.16)
        notes: |-
          A drop shadow: 16px down, 24px blur, no spread, black at 16% (the same as `opacity/soft`). In code it's `--shadow-floating`, the only elevation token in the kit. If I ever need a second shadow, I'll make a proper `shadow/*` scale.
        token: shadow/floating
guidance:
  status: agreed
  use:
    - title: Things lifted above the page
      text: "Anything lifted above the content: menus, popovers, a card being dragged."
  avoid:
    - title: Cards at rest
      text: Cards just sitting there. Surfaces are told apart by tone, not shadow.
  behaviour: |-
    `0 16px 24px rgba(0,0,0,0.16)`, as `--shadow-floating`. There's no family of elevation tokens yet. If I ever need a second shadow, that's when I add one.
  accessibility:
    separation: on a dark background, a shadow doesn't separate anything for someone with low vision. Pair it with a different surface tone or an outline.
