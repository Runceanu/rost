# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: effect-menu
name: Menu
kind: effect
status: draft
summary: Frosted glass, a 12px backdrop blur, for a nav or cards that sit over content.
category: effects
related: [ menu, effect-thumb ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "29:5"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=29-5
  extractedAt: "2026-08-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
elements:
  root:
    notes: |-
      The frosted surface behind the main nav. In Figma it's the effect style called "Menu".
    styles:
      backdrop-filter:
        value: blur(12px)
        notes: |-
          Frosted glass: it blurs whatever is behind it. 12px is the standard (`--effect-menu`), used on the nav and on the case-study info cards. Figma doesn't hand over this style's blur size through Dev Mode, so I took 12px from where it's really used (the the portfolio site nav, Figma node 179:595: black at 0.48 with a 12px blur). There's also a 24px version, `--effect-menu-lg`, for the bigger case-study surfaces. That one's my choice in code, not a separate Figma style: I treat all frosted glass as one effect. Thumb is a different style, only for project thumbnails.
        token: effect/menu
guidance:
  status: agreed
  use:
    - |-
      Things that float over content and have to stay readable while it scrolls underneath: the nav, the hero info cards.
  avoid:
    - Project thumbnails, they have their own (**Thumb effect**).
    - On top of another frosted surface. Two blurs just turn to mud.
  behaviour: |-
    `backdrop-filter: blur(12px)`, and a 24px version for the bigger case-study surfaces. I took the 12px from how the nav uses it. I haven't read it from the style itself yet (see "Not right yet").
  accessibility:
    contrast: check text against the busiest thing that can scroll under it, not a flat colour.
    fallback: |-
      where `backdrop-filter` doesn't work, use a solid surface. Never a see-through one you can't read.
pending:
  reason: |-
    The 12px comes from how the nav uses it, not from the "Menu" style itself (Dev Mode only gave back the swatch for node 29:5). Worth checking in Figma's effect panel. If the real size is different, update `--effect-menu` and this value.
  propertiesToRead:
    - The real blur size of the "Menu" style, and whether it's tied to a variable.
  nodesToWalk: [ "29:5" ]
