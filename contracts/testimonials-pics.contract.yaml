# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: testimonials-pics
name: TestimonialPicture
kind: component
status: review
summary: The photo of the person behind a testimonial.
category: display
related: [ testimonials ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "438:72"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=438-72
  extractedAt: "2026-10-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
props:
  picture: { type: slot, notes: "The photo. In React, `src` and `alt`, or your own image as the children." }
elements:
  root:
    notes: A 56px square. Testimonials rounds it.
    styles:
      display: { value: block, assert: false }
      position: { value: relative, assert: false }
      overflow: { value: hidden, assert: false }
      flex-shrink: { value: "0", assert: false }
      width: { value: 56px, token: spacing/size/large }
      height: { value: 56px, token: spacing/size/large }
  image:
    notes: The photo, cropped to fill the square.
    styles:
      position: { value: absolute, assert: false }
      inset: { value: "0", assert: false }
      width: { value: 100%, assert: false }
      height: { value: 100%, assert: false }
      object-fit: { value: cover, assert: false }
guidance:
  status: proposed
  use:
    - title: A testimonial's photo
      text: The photo at the start of a **Testimonials** row, next to the person's name and role.
      show: testimonials-pics
  avoid:
    - title: An avatar elsewhere
      text: A profile picture anywhere else, an avatar in a list or a header. Rost has no Avatar yet, so ask for one rather than reusing this.
      show: testimonials-pics
    - title: A logo
      text: A logo instead of a face. A company's quote goes in **Testimonials** with no picture.
  behaviour: |-
    A 56px square that crops the photo to fill it. It has no states and does nothing when you press it; the row around it does. Testimonials rounds it, so on its own it's square.
  accessibility:
    element: "a `<span>` holding an `<img>`. It's never a link or a button."
    name: "`alt=\"\"` when the name is right next to it, as in Testimonials, so a screen reader doesn't say it twice. Anywhere else, `alt` is the person's name."
    colour: "nothing is said by colour. The name and role carry who it is."
  content: A real photo of the person, with their consent, square or close to it, at least 112px so it's sharp on a 2x screen. In this repo's examples and on rost.build it's a landscape, never a real person.
implementations:
  portfolio-site:
    component: src/rost/testimonials-pics/TestimonialPicture.tsx
    root: .rost-testimonials-pics
