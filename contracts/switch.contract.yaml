# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: switch
name: Switch
kind: component
status: draft
summary: A setting that's on or off and takes effect straight away. A pill track with a thumb that moves across. The label is SwitchField's.
category: selection
related: [ switch-field, toggle, chips ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "528:402"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=528-402
  extractedAt: "2026-10-30"
  extractedBy: hand
  frozenAt: "2026-10-30"
props:
  checked: { type: boolean, default: false, notes: "On or off. It's the switch's `aria-checked`. In React, controlled with `checked` or left to itself with `defaultChecked`." }
states: [ Default, Hover, Pressed, Focus, Disabled ]
elements:
  root:
    notes: "A `<button role=\"switch\">` holding the track. The browser's own look goes. It has no words of its own: SwitchField puts a label beside it, or give it an `aria-label`."
    styles:
      display: { value: inline-flex, assert: false }
      align-items: { value: center }
      vertical-align: { value: middle, assert: false }
      position: { value: relative, assert: false }
      padding: { token: spacing/gap/none, value: 0px }
      background: { value: none, assert: false }
      border: { value: none, assert: false }
      font: { value: inherit, assert: false }
      cursor: { value: pointer, assert: false }
      outline: { value: none, assert: false }
  track:
    notes: "The pill. 40 by 24, the size of a Toggle across and a Chip down."
    styles:
      position: { value: relative, assert: false }
      flex-shrink: { value: "0", assert: false }
      width: { token: spacing/size/medium, value: 40px }
      height: { token: spacing/size/small, value: 24px }
      border-radius: { token: spacing/radius/full, value: 10000px }
      outline-style: { value: solid, assert: false, notes: "The track's 1px edge, drawn inside it at full strength over the faded fill, so the switch can be seen against the page (WCAG 1.4.11, 3:1). It used to be part of the faded layer, which left it at 1.9:1 in dark and nothing in light." }
      outline-width: { token: spacing/outline/small, value: 1px }
      outline-offset: { value: "calc(-1 * var(--spacing-outline-small))", untokenised: "Composed from a token: the edge sits inside the track." }
      isolation: { value: isolate, assert: false, notes: "So the fill can sit under the track's edge: the fill is absolutely placed and would otherwise paint over the outline." }
  background:
    notes: "The track's fill, on its own layer. Off, it's faded the way an off Toggle's plate is, so the thumb on top stays solid. The edge is the track's."
    styles:
      position: { value: absolute }
      inset: { value: "0" }
      border-radius: { token: spacing/radius/full, value: 10000px }
      pointer-events: { value: none, assert: false }
      z-index: { value: "-1", assert: false }
  thumb:
    notes: "The 16px dot, 4px in from the track's edge. It sits left when off and right when on. It jumps for now: there are no motion tokens yet, and when there are it should slide."
    styles:
      position: { value: absolute }
      top: { token: spacing/gap/2xsmall, value: 4px }
      left: { token: spacing/gap/2xsmall, value: 4px }
      width: { token: spacing/size/2xsmall, value: 16px }
      height: { token: spacing/size/2xsmall, value: 16px }
      border-radius: { token: spacing/radius/full, value: 10000px }
      pointer-events: { value: none, assert: false }
  focus-ring:
    notes: "Around the track, keeping the pill's shape."
    styles:
      display: { value: none, assert: false }
      position: { value: absolute }
      inset: { value: "calc(-1 * var(--spacing-gap-2xsmall))", untokenised: "Composed from a token: the ring sits spacing/gap/2xsmall outside the track." }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      border-radius: { token: spacing/radius/full, value: 10000px }
      pointer-events: { value: none, assert: false }
variants:
  - when: { checked: true }
    elements:
      track:
        outline-color: { token: switch/on/edge, value: "#00d669", notes: "The fill's own green in dark, where the fill already stands out. In light it's a dark green, because the bright fill is 1.9:1 on white." }
      thumb:
        left: { value: "calc(100% - var(--spacing-size-2xsmall) - var(--spacing-gap-2xsmall))", untokenised: "Composed from tokens: the far end of the track, less the thumb and its 4px." }
  - when: { checked: false }
    elements:
      track:
        outline-color: { token: switch/off/edge, value: "#747573", notes: "A field's edge: 4.3:1 on the dark page, 4.5:1 on the light one." }
  - when: { state: Focus }
    elements:
      focus-ring:
        display: { value: block, assert: false }
  - when: { state: Disabled }
    elements:
      root:
        opacity: { token: opacity/gentle, value: "0.24" }
        cursor: { value: default, assert: false }
  - when: { state: Default, checked: false }
    figmaNode: "528:350"
    elements:
      background:
        background: { token: switch/off/default/track, value: "#3a3a3a" }
        opacity: { token: opacity/gentle, value: "0.24" }
      thumb:
        background: { token: switch/off/default/thumb, value: "#d3d9d5" }
  - when: { state: Hover, checked: false }
    figmaNode: "528:355"
    elements:
      background:
        background: { token: switch/off/hover/track, value: "#747573" }
        opacity: { token: opacity/mild, value: "0.32" }
      thumb:
        background: { token: switch/off/hover/thumb, value: "#ededed" }
  - when: { state: Pressed, checked: false }
    figmaNode: "528:360"
    elements:
      background:
        background: { token: switch/off/pressed/track, value: "#999" }
        opacity: { token: opacity/mild, value: "0.32" }
      thumb:
        background: { token: switch/off/pressed/thumb, value: "#d3d9d5" }
  - when: { state: Focus, checked: false }
    figmaNode: "528:365"
    elements:
      background:
        background: { token: switch/off/focus/track, value: "#3a3a3a" }
        opacity: { token: opacity/gentle, value: "0.24" }
      thumb:
        background: { token: switch/off/focus/thumb, value: "#d3d9d5" }
      focus-ring:
        border-color: { token: switch/off/focus/focus-ring, value: "#999" }
  - when: { state: Disabled, checked: false }
    figmaNode: "528:371"
    elements:
      background:
        background: { token: switch/off/disabled/track, value: "#3a3a3a" }
        opacity: { token: opacity/gentle, value: "0.24" }
      thumb:
        background: { token: switch/off/disabled/thumb, value: "#d3d9d5" }
  - when: { state: Default, checked: true }
    figmaNode: "528:376"
    elements:
      background:
        background: { token: switch/on/default/track, value: "#00d669" }
        opacity: { token: opacity/solid, value: "1" }
      thumb:
        background: { token: switch/on/default/thumb, value: "#060805" }
  - when: { state: Hover, checked: true }
    figmaNode: "528:381"
    elements:
      background:
        background: { token: switch/on/hover/track, value: "#00b450" }
        opacity: { token: opacity/solid, value: "1" }
      thumb:
        background: { token: switch/on/hover/thumb, value: "#060805" }
  - when: { state: Pressed, checked: true }
    figmaNode: "528:386"
    elements:
      background:
        background: { token: switch/on/pressed/track, value: "#00913a" }
        opacity: { token: opacity/solid, value: "1" }
      thumb:
        background: { token: switch/on/pressed/thumb, value: "#060805" }
  - when: { state: Focus, checked: true }
    figmaNode: "528:391"
    elements:
      background:
        background: { token: switch/on/focus/track, value: "#00d669" }
        opacity: { token: opacity/solid, value: "1" }
      thumb:
        background: { token: switch/on/focus/thumb, value: "#060805" }
      focus-ring:
        border-color: { token: switch/on/focus/focus-ring, value: "#b6ffda" }
  - when: { state: Disabled, checked: true }
    figmaNode: "528:397"
    elements:
      background:
        background: { token: switch/on/disabled/track, value: "#00d669" }
        opacity: { token: opacity/solid, value: "1" }
      thumb:
        background: { token: switch/on/disabled/thumb, value: "#060805" }
guidance:
  status: proposed
  use:
    - title: A setting that works at once
      text: "A setting that's on or off and works the moment you flip it: email me receipts, show cents, dark charts."
      show: state=Default, checked=True
  avoid:
    - title: A choice that waits for Save
      text: A choice that waits for a Save button. That's a checkbox, and Rost doesn't have one yet.
      show: state=Default, checked=False
    - title: Filtering the screen
      text: Filtering what's on screen. That's **Chip**, with `selected`.
    - title: A button that stays pressed
      text: An icon button that stays pressed, like bold in an editor. That's **Toggle**.
  behaviour: |-
    Off is a faded track with the thumb on the left, the way an off Toggle is faded. On is a solid primary green track with a dark thumb on the right. Hover, press and focus come from the browser and follow Toggle's colours. Disabled fades it.

    It's my draft. I built it in code from Toggle's and Button's tokens, then drew it in the kit, on a page of its own, bound to the same variables. Its label moved to SwitchField on 2026-10-31. The ten variants match Figma.
  accessibility:
    element: "`<button type=\"button\" role=\"switch\">` with `aria-checked`. Switch sets both."
    name: "It has no text of its own. In a SwitchField the label names it; on its own it needs an `aria-label`."
    keyboard: "Tab reaches it. Space flips it, and so does Enter, since it's a button."
    focus: "`focus-ring` around the track, on `:focus-visible`."
    colour: "On and off aren't only green and grey: the thumb moves from one end to the other."
  content: "The words go in SwitchField's label, or in `aria-label`. Say what's on when it's on, as a short phrase in sentence case: \"Email me receipts\", not \"Receipts: on/off\"."
