schemaVersion: 2
id: text
name: Text
kind: component
status: review
summary: Rost's type ramp as one component, from the 64px page title down to the 12px label.
category: display
related: [ link, code ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "705:29"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=705-29
  extractedAt: "2026-11-04"
  extractedBy: hand
  frozenAt: "2026-11-04"
props:
  variant:
    type: enum
    values: [ display, headline, sub-headline, lede, body, paragraph, label, eyebrow ]
    default: body
    notes: "The size. Figma's text styles, plus `lede` for a page's opening line and `eyebrow` for the small capitals over a title."
  tone:
    type: enum
    values: [ primary, secondary, tertiary, positive, warning, negative ]
    notes: "The colour, from `non-interactive/foreground`. Left out, it's the colour around it. The last three are for words that carry a status, like a value with a token, one with a suggested token, and a gap."
  weight:
    type: enum
    values: [ regular, medium ]
    notes: Left out, the variant's own weight. Medium for titles, regular for the rest.
  as:
    type: string
    default: p
    notes: "The element. Pick by meaning (`h1`, `h2`, `p`, `span`), not by size: the variant does the size."
  children: { type: slot }
elements:
  root:
    notes: "Whatever `as` says. No margins: the layout around it does the spacing."
    styles:
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-size: { token: typography/body/font-size, value: 16px }
      line-height: { token: typography/body/line-height, value: 22px }
      letter-spacing: { token: typography/body/letter-spacing, value: 0px }
      font-weight: { token: typography/body/font-weight/regular, value: "400" }
