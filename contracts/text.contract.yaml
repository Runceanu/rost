guidance:
  status: proposed
  use:
    - title: Every line of words
      text: "Titles, paragraphs, captions, the small print under a table. If it's words on a page and not inside another component, it's Text."
      show: variant=body
    - title: Titles by meaning
      text: "`as=\"h1\"` for the page's title, `h2` for its sections, whatever their size. A small section title is `variant=eyebrow as=h3`."
      show: variant=display
  avoid:
    - title: Words inside a component
      text: "Inside a Button, a Badge or a TableItem. They bring their own type."
    - title: Making up a size
      text: "A font size of your own. If none of these fits, the ramp is missing a step, and I'd rather add it here."
  behaviour: |-
    One element, one size from the ramp, and no margins. `tone` and `weight` change only what they say. `display`, `headline` and `sub-headline` balance their lines, the longer ones wrap without leaving one word alone.

    Not done yet: the ramp doesn't step down on a phone. 64px is a lot on a 375px screen, so the Rost site steps `display` and `sub-headline` down itself for now. That belongs here, once I know the steps for the apps too.
  accessibility:
    element: "whatever `as` says. Headings go in order: one `h1`, then `h2`, then `h3`."
    colour: "Every tone is 4.5:1 or better on the page and on the secondary plate, in both themes. The tightest are `tertiary` in light, 4.6:1 on the plate, and `negative` in dark, 6.2:1."
  content: Sentence case everywhere, titles too. `eyebrow` is written in sentence case and drawn in capitals, so screen readers don't spell it out.
