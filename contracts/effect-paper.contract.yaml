# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: effect-paper
name: Paper
kind: effect
status: review
summary: A sheet of dots behind a hero. It reacts to the cursor, buttons and clicks, can sketch components on itself, and never moves on its own.
category: effects
related: [ hero-media ]
source:
  tool: code
  repo: runceanu-portfolio
  path: src/components/HeroBackdrop.jsx
  extractedAt: "2026-10-19"
  frozenAt: "2026-10-20"
elements:
  sheet:
    notes: |-
      A canvas of dots behind the hero. A CSS mask shapes it: on runceanu.com that's a 1104px circle centred on the hero text (a 552px radial gradient, solid to 40%, gone by 92%). It's sized so the dot grid lines up with the content, not the container. When nothing's happening it costs one still frame, and with reduced motion you get the still sheet and none of what's below.
    styles:
      pitch:
        token: spacing/gap/medium
        value: 16px
        notes: |-
          The rhythm of the grid. Everything else in the effect is a multiple of it: sketch sizes, distances, fades.
      dot-opacity: { token: opacity/soft, value: "0.16" }
      background: { token: non-interactive/background/primary, value: "#060805" }
  dot:
    notes: One point on the grid. It never moves by itself, it only reacts (to the lens, the ripple, the pen). The paper should never twinkle.
    styles:
      radius:
        value: 1px
        notes: Fixed when nothing's happening. Under the lens it grows to at most 1 + 1.3 times the field, about 2.3px at the peak. It only grows. New dots never appear.
        untokenised: Tuned to the 16px grid. Nothing else would use it.
  lens:
    notes: |-
      The dome every behaviour shares. It has three sources: the cursor (the magnifier), the button halo (hover a hero button and a lens rises under its centre, as if the button presses into the paper), and press ink (press down and the sheet dents, fast going in and slow coming back). Each dot looks at all three and the strongest wins, so lenses never add up. Dots inside grow and get pushed outward. They never multiply and never change shape.
    styles:
      radius:
        value: 210px
        untokenised: Tuned by eye for how the lens moves. Only the paper uses it.
      push:
        value: 9px
        notes: How far dots move outward at the peak, per unit of field. The dome eases smoothly to nothing at its edge. Both the push and the growth scale with how strong the source is.
        untokenised: Tuned by eye for how the lens moves. Only the paper uses it.
      accent:
        token: actions/primary/default/background
        value: "#00d669"
        notes: |-
          A touch of green, only at the very top of the strongest field (above 0.78). I ration green: the peak, the availability dot and the logo dot are the same green.
      cursor:
        value: radius 210px, power 1.0
        notes: Follows with a little lag. The first touch starts right at the pointer.
        untokenised: "Tuned by eye: how wide the lens is, and how fast it fades. Only the paper uses it."
      halo:
        value: radius 240px, power 1.3
        notes: Sits on the centre of the hovered button. It's wider and stronger than the cursor lens, which is always in the same spot and would hide it otherwise.
        untokenised: "Tuned by eye: how wide the lens is, and how fast it fades. Only the paper uses it."
      press:
        value: radius 330px, power 1.7
        notes: The strongest lens of all. It comes in about three times faster than it goes away. The field stops at 1.7.
        untokenised: "Tuned by eye: how wide the lens is, and how fast it fades. Only the paper uses it."
  ripple:
    notes: |-
      A ring (a soft band, about 1.8s) that crosses the sheet from the middle. On runceanu.com it's triggered by the availability dot's own pulse, every second beat: so every 8s, in step with it. rost.build has no such dot, so there it comes every 8s on its own, the first a second after the page opens. It only runs while the hero is on screen.
  pen:
    notes: |-
      Two seconds after the last one fades, the pen sketches the next kit component in 2px lines (colour `non-interactive/foreground/secondary` at the ink opacity). It draws line by line (about 1s), holds (about 1.5s), then fades. The first one comes half a second after the page opens. The rule of the grid: outer shapes follow the dot rows and columns exactly, start on a dot, measure in whole cells, and round their corners between dots. Small inner details (a check, an x, a knob, bars, a caret) keep their natural shape. Every point of a line moves with the lens, so the ink bulges like the dots do. One sketch at a time, and never over the words beside the paper: each one picks a shape and a spot that keep a cell clear of them, and skips its turn if nothing fits.
    styles:
      ink-opacity:
        token: opacity/mild
        value: "0.32"
        notes: |-
          Was a plain 0.3. On 2026-10-19 I tied it to `opacity/mild` (0.32, a touch stronger). `HeroBackdrop.jsx` reads `--opacity-mild`.
      stroke-width: { token: spacing/outline/medium, value: 2px }
      cadence:
        value: 2s between sketches, each one 3.2s from first line to gone
        notes: "Made faster on 2026-10-23 for rost.build, and the pause set to an even 2s. runceanu.com still draws over 5.2s and waits 7 to 8 at random." 
        untokenised: How often the pen draws. There are no motion tokens yet.
guidance:
  status: agreed
  use:
    - Behind the home hero, and only there. It's the site's signature, and using it twice waters it down.
  avoid:
    - Behind dense content or forms. At small sizes the dots fight with the text.
  behaviour: The dots only ever react, through the lens, the ripple and the pen described in the parts. They never animate on their own. Everything snaps to the 16px grid. When nothing happens it's one still frame, and it only runs while the hero is on screen.
  accessibility:
    decorative: the canvas is `aria-hidden="true"` and never takes focus.
    motion: |-
      with `prefers-reduced-motion` you get the still sheet, and none of the movement.
implementations:
  runceanu-portfolio:
    component: src/components/HeroBackdrop.jsx
