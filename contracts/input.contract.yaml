props:
  label: { type: slot, notes: "The field's name. It sits where you type until there's a value or focus, then moves up small." }
  value: { type: slot, notes: "What's typed. In React, the input's value." }
  placeholder: { type: slot, notes: Shown in the empty field once it has focus. Never instead of the label. }
  supportive: { type: slot, notes: "One line of help under the field, or the fix when there's an error." }
  configuration:
    type: enum
    values: [ Empty, Filled ]
    default: Empty
    notes: In code it follows the value; you don't set it.
  selected:
    type: boolean
    default: false
    notes: The field has focus. In code it follows focus; `selected` forces it, for previews and tests.
  error:
    type: boolean
    default: false
  icon: { type: slot, notes: "The leading icon, Figma's lock by default." }
stateSelectors:
  Disabled: ":has(input:disabled)"
states: [ Default, Hover, Disabled ]
