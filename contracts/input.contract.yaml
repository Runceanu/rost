guidance:
  status: agreed
  use:
    - "Any single line of text: email, name, an amount, search."
  avoid:
    - Picking from a known list. That's **Chip** or **Toggle**, free text just invites typos.
    - Several lines of text. That's **Textarea**.
  behaviour: |-
    Four things change it:

    - **`configuration`**: `Empty` shows the label where you'll type. `Filled` moves it up and shows the value.
    - **`selected`**: it has focus, so the focus ring shows.
    - **`error`**: the outline, label, help text and icons go red, and the alarm icon shows up on the right.
    - **`state`**: `Default`, `Hover` and `Disabled`.

    Check what people typed when they leave the field or submit, not on every key.
  accessibility:
    element: |-
      a real `<input>` with a `<label for>`. The floating label is the label. Never a `placeholder`.
    supportiveText: connected with `aria-describedby`.
    error: "`aria-invalid=\"true\"`, and the help text says how to fix it."
    colour: an error shows as the alarm icon and the message, not only red.
    focus: |-
      the ring shows on `:focus-visible` and when you arrive by keyboard. Never remove the outline without the ring.
    lockIcon: |-
      just decoration, unless it means read-only. If it does, set `readonly` and say so in the help text.
  content: |-
    Label: a noun, sentence case ("Email address"). Help text: one line. Before an error it's a hint, after it it's the fix ("Use at least 8 characters", not "Invalid input"). The help line hangs below the 56px field, outside it, so a layout leaves `spacing/gap/2xsmall` plus its 12px line (16px) under a field that has one.
