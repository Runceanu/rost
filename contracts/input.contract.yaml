schemaVersion: 2
id: input
name: Input
kind: component
status: review
summary: A 56px text field with a floating label, an optional lock icon, a line of help text and an error state.
category: inputs
related: [ inline-banner ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "240:273"
