guidance:
  status: agreed
  use:
    - title: On and off, straight away
      text: Switching a view or a filter on and off, when the change happens straight away.
      show: labelled, on
    - title: One of a short set
      text: "Used to pick one option from a short set, as a group: a year switcher, a view switcher."
      show: state=Default, selected=True
  avoid:
    - title: Doing something
      text: Doing something. That's **IconButton**. A toggle remembers, a button doesn't.
    - title: A settings switch
      text: A setting that's on or off, with a label. That's **Switch**.
  behaviour: |-
    It changes with `selected` and `state`. Off, it's a plate with 12px corners on the secondary surface, faded down. On, it becomes a fully round primary pill. The change of shape is part of the signal, not just the colour.
  accessibility:
    alone: "`<button aria-pressed=\"true|false\">`."
    group: |-
      `role="radio"` with `aria-checked`, inside **ToggleGroup**, which is the named `role="radiogroup"` and does the keys: arrows move between options and choose, Tab gets you in and out.
    name: "`aria-label` when it's icon only."
    focus: |-
      `focus-ring` (2px, `actions/primary/focus/focus-ring` when it's on), on `:focus-visible`.
    colour: on and off show in the shape (12px corners to fully round) as well as the colour.
  content: "An icon, or a short text label: a year, a number, one word. The label makes the toggle grow wider than 40px, and it never wraps. Figma only draws the icon-only one."
implementations:
  accounting-app:
    component: src/rost/toggle/Toggle.tsx
    root: .rost-toggle
