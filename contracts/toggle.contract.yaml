# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: toggle
name: Toggle
kind: component
status: stable
summary: A 40×40 icon button that stays on or off, alone or as one choice in a group.
category: selection
related: [ toggle-group, icon-button, chips ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "168:1149"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=168-1149
  extractedAt: "2026-08-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
props:
  selected:
    type: boolean
    default: false
  icon: { type: slot, notes: "The glyph. Figma's arrow by default. Draw it with `currentColor`." }
  label:
    type: slot
    notes: Text instead of, or after, the icon. In React, the children. A labelled toggle grows wider than 40px to fit (`labelled`).
  labelled:
    type: boolean
    default: false
    notes: Set by the component when there's a label. Not a Figma axis; added on 2026-10-22 for the accounting app's year switcher.
states: [ Default, Hover, Pressed, Focus, Disabled ]
elements:
  root:
    styles:
      justify-content: { value: center }
      align-items: { value: center }
      display: { value: inline-flex, assert: false }
      vertical-align: { value: middle, assert: false }
      position: { value: relative, assert: false }
      background: { value: none, assert: false, notes: "A `<button>`. The browser's own look goes; on and off draw their own." }
      border: { value: none, assert: false }
      cursor: { value: pointer, assert: false }
      outline: { value: none, assert: false }
      gap: { token: spacing/gap/small, value: 8px }
      padding-left: { token: spacing/gap/medium-large, value: 20px }
      padding-right: { token: spacing/gap/medium-large, value: 20px }
      padding-top: { token: spacing/gap/none, value: 0px }
      padding-bottom: { token: spacing/gap/none, value: 0px }
      width: { token: spacing/size/medium, value: 40px }
      height: { token: spacing/size/medium, value: 40px }
  background:
    notes: The see-through plate when it's off, on its own layer so the icon stays solid.
    styles:
      position: { value: absolute }
      inset: { value: "0" }
      pointer-events: { value: none, assert: false }
  icons-arrow-left:
    notes: "The 20px icon slot. Its colour is the action's `icon` token: primary when it's on, secondary when it's off."
    styles:
      flex-shrink: { value: "0", assert: false }
      position: { value: relative, assert: false }
      overflow: { value: clip }
      width: { value: 20px, token: spacing/size/xsmall }
      height: { value: 20px, token: spacing/size/xsmall }
  label:
    notes: Not in Figma, which has no labelled toggle. Body type, medium, with tabular numbers so years line up. Its colour follows the state, the way a button's label does.
    styles:
      position: { value: relative, assert: false }
      white-space: { value: nowrap, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/body/font-weight/medium, value: "500" }
      line-height: { token: typography/body/line-height, value: 22px }
      font-size: { token: typography/body/font-size, value: 16px }
      letter-spacing: { token: typography/body/letter-spacing, value: 0px }
      font-variant-numeric: { value: tabular-nums, assert: false }
  glyph:
    notes: "Figma's arrow, drawn as a mask in the icon's colour. A caller's own icon replaces it and should use `currentColor`."
    styles:
      display: { value: block, assert: false }
      width: { value: 100% }
      height: { value: 100% }
      background: { value: currentColor }
      mask:
        value: url(./icon-arrow-left.svg) center / contain no-repeat
        untokenised: "The icon file itself, `assets/icons/arrow-left.svg`, the same shape as Figma's `Union` layer."
  focus-ring:
    styles:
      display: { value: none, assert: false }
      position: { value: absolute }
      inset: { value: "calc(-1 * var(--spacing-gap-2xsmall))", untokenised: "Composed from a token: the ring sits spacing/gap/2xsmall outside the element." }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      pointer-events: { value: none, assert: false }
variants:
  - when: { selected: true }
    elements:
      root:
        border-radius: { token: spacing/radius/full, value: 10000px }
  - when: { selected: false }
    elements:
      root:
        border-radius: { token: spacing/radius/medium, value: 12px }
      background:
        border-sides: { value: left top }
        border-radius: { token: spacing/radius/medium, value: 12px }
  - when: { state: Disabled }
    elements:
      root:
        opacity: { token: opacity/gentle, value: "0.24" }
        cursor: { value: default, assert: false }
  - when: { state: Focus }
    elements:
      focus-ring:
        display: { value: block, assert: false }
  - when: { state: Default, selected: true }
    figmaNode: "168:1150"
    elements:
      root:
        background: { token: toggle/on/default/background, value: "#00d669" }
        box-shadow:
          value: inset var(--spacing-outline-small) var(--spacing-outline-small) 0 0 var(--toggle-on-default-outline), inset 0 0 0 var(--spacing-outline-small) var(--toggle-on-default-edge)
          untokenised: "Figma's 1px left and top stroke, drawn inside the shape as Figma draws it, over a 1px ring in the positive green. The ring is the fill's own colour in dark; in light it's a dark green, because the bright fill is 1.8:1 on white and an on toggle has to be seen (WCAG 1.4.11). The widths and colours are tokens."
      icons-arrow-left:
        color: { token: toggle/on/default/icon, value: "#3a3a3a" }
      label:
        color: { token: toggle/on/default/label, value: "#060805" }
  - when: { state: Default, selected: false }
    figmaNode: "168:1152"
    elements:
      background:
        background: { token: toggle/off/default/background, value: "#3a3a3a" }
        border-color: { token: toggle/off/default/outline, value: "#ededed" }
        opacity: { token: opacity/gentle, value: "0.24" }
      icons-arrow-left:
        color: { token: toggle/off/default/icon, value: "#00d669" }
      label:
        color: { token: toggle/off/default/label, value: "#d3d9d5" }
  - when: { state: Hover, selected: true }
    figmaNode: "168:1159"
    elements:
      root:
        background: { token: toggle/on/hover/background, value: "#00b450" }
        box-shadow:
          value: inset var(--spacing-outline-small) var(--spacing-outline-small) 0 0 var(--toggle-on-hover-outline), inset 0 0 0 var(--spacing-outline-small) var(--toggle-on-hover-edge)
          untokenised: "Figma's 1px left and top stroke, drawn inside the shape as Figma draws it, over a 1px ring in the positive green. The ring is the fill's own colour in dark; in light it's a dark green, because the bright fill is 1.8:1 on white and an on toggle has to be seen (WCAG 1.4.11). The widths and colours are tokens."
      icons-arrow-left:
        color: { token: toggle/on/hover/icon, value: "#3a3a3a" }
      label:
        color: { token: toggle/on/hover/label, value: "#060805" }
  - when: { state: Hover, selected: false }
    figmaNode: "168:1161"
    elements:
      background:
        background: { token: toggle/off/hover/background, value: "#747573" }
        border-color: { token: toggle/off/hover/outline, value: "#ededed" }
        opacity: { token: opacity/mild, value: "0.32" }
      icons-arrow-left:
        color: { token: toggle/off/hover/icon, value: "#00b450" }
      label:
        color: { token: toggle/off/hover/label, value: "#ededed" }
  - when: { state: Pressed, selected: true }
    figmaNode: "168:1170"
    elements:
      root:
        background: { token: toggle/on/pressed/background, value: "#00913a" }
        box-shadow:
          value: inset var(--spacing-outline-small) var(--spacing-outline-small) 0 0 var(--toggle-on-pressed-outline), inset 0 0 0 var(--spacing-outline-small) var(--toggle-on-pressed-edge)
          untokenised: "Figma's 1px left and top stroke, drawn inside the shape as Figma draws it, over a 1px ring in the positive green. The ring is the fill's own colour in dark; in light it's a dark green, because the bright fill is 1.8:1 on white and an on toggle has to be seen (WCAG 1.4.11). The widths and colours are tokens."
      icons-arrow-left:
