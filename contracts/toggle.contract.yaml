guidance:
  status: agreed
  use:
    - Switching a view or a filter on and off, when the change happens straight away.
    - Picking one option from a short set, as a group. The year switcher in akount.ing works like this.
  avoid:
    - Doing something. That's **IconButton**. A toggle remembers, a button doesn't.
    - A settings-style switch with a label. There isn't one in the kit yet, so ask for one rather than stretching Toggle.
  behaviour: |-
    It changes with `selected` and `state`. Off, it's a plate with 12px corners on the secondary surface, faded down. On, it becomes a fully round primary pill. The change of shape is part of the signal, not just the colour.
  accessibility:
    alone: "`<button aria-pressed=\"true|false\">`."
    group: |-
      `role="radio"` with `aria-checked`, inside a `role="radiogroup"` that has a name. Arrow keys move between options, Tab gets you in and out.
    name: "`aria-label` when it's icon only."
    focus: |-
      `focus-ring` (2px, `actions/primary/focus/focus-ring` when it's on), on `:focus-visible`.
    colour: on and off show in the shape (12px corners to fully round) as well as the colour.
  content: Icon only in the kit. akount.ing adds a text label, and that's a declared deviation. If you add one, keep it to a short word or a number.
implementations:
  a-kaunt:
    component: src/components/Toggle.tsx
    root: .ak-toggle
    deviations:
      - what: |-
          Accepts a text label; width grows past 40px to fit it, height stays 40px. Label colour follows the surface: secondary label unselected, primary label selected.
        why: The year switcher needs text. The kit's toggle is icon-only and specifies no label colour.
        raisedWithDesign: false
      - what: Rendered as role=radio inside a ToggleGroup radio group, which has no surface of its own.
        why: Toggles are used as a single-choice set; ToggleGroup is not a kit component.
        raisedWithDesign: false
