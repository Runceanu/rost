    elements:
      background:
        background: { token: toggle/off/pressed/background, value: "#999" }
        border-color: { token: toggle/off/pressed/outline, value: "#ededed" }
        opacity: { token: opacity/mild, value: "0.32" }
      icons-arrow-left:
        color: { token: toggle/off/pressed/icon, value: "#00d669" }
      label:
        color: { token: toggle/off/pressed/label, value: "#d3d9d5" }
