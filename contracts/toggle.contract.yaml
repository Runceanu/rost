    figmaNode: "168:1190"
    elements:
      root:
        background: { token: toggle/on/focus/background, value: "#00d669" }
        box-shadow:
          value: inset var(--spacing-outline-small) var(--spacing-outline-small) 0 0 var(--toggle-on-focus-outline), inset 0 0 0 var(--spacing-outline-small) var(--toggle-on-focus-edge)
          untokenised: "Figma's 1px left and top stroke, drawn inside the shape as Figma draws it, over a 1px ring in the positive green. The ring is the fill's own colour in dark; in light it's a dark green, because the bright fill is 1.8:1 on white and an on toggle has to be seen (WCAG 1.4.11). The widths and colours are tokens."
      icons-arrow-left:
