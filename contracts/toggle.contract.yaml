        color: { token: toggle/on/disabled/label, value: "#060805" }
  - when: { state: Disabled, selected: false }
    figmaNode: "168:1183"
    elements:
      background:
        background: { token: toggle/off/disabled/background, value: "#3a3a3a" }
        border-color: { token: toggle/off/disabled/outline, value: "#ededed" }
        opacity: { token: opacity/mild, value: "0.32" }
      icons-arrow-left:
        color: { token: toggle/off/disabled/icon, value: "#00d669" }
      label:
        color: { token: toggle/off/disabled/label, value: "#d3d9d5" }
