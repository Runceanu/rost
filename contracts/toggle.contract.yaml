guidance:
  status: proposed
  use:
    - To switch a view or filter on and off, where the change applies immediately.
    - In a group, to pick one option from a short set (in A-kaunt, the year switcher).
  avoid:
    - To fire an action, use **IconButton**. A toggle remembers, a button doesn't.
    - For a settings-style on/off with a text label, there is no switch in the kit yet. Raise it rather than restyling Toggle.
  behaviour: |-
    Two axes: `selected` (`True` / `False`) and `state`. Unselected is a 12px-radius plate on the secondary surface at low opacity. Selected becomes a full-radius primary pill. The shape change is part of the signal, not only the colour.
  accessibility:
    alone: "`<button aria-pressed=\"true|false\">`."
    group: |-
      `role="radio"` with `aria-checked`, inside a `role="radiogroup"` with a name. Arrow keys move between options, and Tab enters and leaves the group.
    name: "`aria-label` when icon-only."
    focus: |-
      `focus-ring` (2px, `actions/primary/focus/focus-ring` when selected), on `:focus-visible`.
    colour: selection is carried by shape (radius 12px → full) as well as colour.
  content: Icon-only in the kit. A-kaunt adds a text label as a declared deviation. Keep any label to one short word or a number.
implementations:
  a-kaunt:
    component: src/components/Toggle.tsx
    root: .ak-toggle
    deviations:
      - what: |-
          Accepts a text label; width grows past 40px to fit it, height stays 40px. Label colour follows the surface: secondary label unselected, primary label selected.
        why: The year switcher needs text. The kit's toggle is icon-only and specifies no label colour.
        raisedWithDesign: false
      - what: Rendered as role=radio inside a ToggleGroup radio group, which has no surface of its own.
        why: Toggles are used as a single-choice set; ToggleGroup is not a kit component.
        raisedWithDesign: false
