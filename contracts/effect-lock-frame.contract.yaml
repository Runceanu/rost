# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: effect-lock-frame
name: Lock frame
kind: effect
status: review
summary: An 8px blur over a locked project's thumbnail, the blurred view behind the lock.
category: effects
related: [ effect-thumb, input ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "224:2"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=224-2
  extractedAt: "2026-08-19"
  extractedBy: mcp
elements:
  root:
    notes: |-
      Whatever the style is applied to: the frame of a locked project thumbnail, the blurred view behind the lock.
    styles:
      filter:
        token: effect/lock-frame
        value: blur(8px)
        notes: |-
          The Figma effect style "Lock frame", a layer blur (`filter: blur()`). It blurs the element's own content, not what's behind it, which is the opposite of Thumb. In Figma its size is tied to `spacing/base-8`, a spacing token borrowed as a blur, and that one isn't in `tokens.css`. In code the whole effect is `--effect-lock-frame`, and that's the token the contract checks.
guidance:
  status: proposed
  use:
    - On the thumbnail of a locked project (NDA, password), together with the lock icon.
  avoid:
    - Loading or disabled states. Blur says "hidden", not "wait".
  behaviour: |-
    `filter: blur(8px)` blurs the element's own content. Thumb is the opposite: it blurs what's behind it. In Figma the blur is tied to `spacing/base-8`, which isn't in `tokens.css`, so the code uses `--effect-lock-frame` instead.
  accessibility:
    name: |-
      say it's locked in words ("Locked case study"). Blur and an icon aren't enough.
    content: blurred text is still in the page for anyone who looks. Don't blur confidential copy, show a placeholder.
