guidance:
  status: proposed
  use:
    - title: One line worth stopping for
      text: "In a case study or a long page, the sentence from a client or a user that says the point."
  avoid:
    - title: Several voices
      text: "A row of people and what they said, with their faces. That's **Testimonials**."
    - title: Emphasis
      text: "Your own words, made bigger to stand out. Write them as a heading."
  behaviour: "It sets the words large next to a green rule and the name under them. It adds no quote marks."
  accessibility:
    element: "`<figure>` with a `<blockquote>` and a `<figcaption>`, the way HTML pairs a quote with who said it."
    colour: "The words are 17:1 on the dark page, the name 7:1."
  content: "Quote exactly, and cut rather than paraphrase. The cite is a name and a role: Client 2, finance lead."
