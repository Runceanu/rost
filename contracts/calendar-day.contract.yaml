guidance:
  status: proposed
  use:
    - title: Picked and today
      text: "The picked day is filled green. Today is green text in medium weight, so it's found without being mistaken for the pick."
      show: "status=today, state=Default"
  avoid:
    - title: On its own
      text: "A CalendarDay only makes sense in a Calendar, which sets its status and moves the focus between days."
  behaviour: "A day from either side of the month is grey and can still be picked; it moves the Calendar to that month. A disabled day can be reached with the keyboard, so the grid has no holes, but pressing it does nothing."
  accessibility:
    element: "`<button>` inside a `gridcell`. Its name is the whole date in the locale's words, like November 17, 2026. The picked one has `aria-selected`, today `aria-current=\"date\"`, a disabled one `aria-disabled`."
    colour: "The numbers are 17:1, the grey ones 7:1 and today's green 10:1 on the dark page. Disabled days are faint on purpose, 1.8:1, and not counted."
