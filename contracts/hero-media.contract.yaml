# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: hero-media
name: Hero Media
kind: pattern
status: review
summary: The full-bleed case-study hero, artwork pinned behind a 16px inset frame and dimmed to one shared level.
category: surfaces
related: [ effect-paper ]
source:
  tool: figma
  fileKey: pg02BcqlCQCVt6LzTAiPhD
  nodeId: "245:2900"
  url: https://www.figma.com/design/pg02BcqlCQCVt6LzTAiPhD/?node-id=245-2900
  extractedAt: "2026-10-18"
  extractedBy: mcp
elements:
  hero:
    notes: Full-bleed section, 630px tall, background colour non-interactive/background/primary. Its padding is the 16px inset frame that shows the page background around the framed image. The width must subtract the real scrollbar width (100vw includes it), or the visible left/right inset reads ~8px while the top reads 16.
    styles:
      height:
        token: spacing/layout/hero-height
        value: 630px
        notes: Token created in code on 2026-10-19 (tokens.css); the Figma file has no variable for it yet, so create spacing/layout/hero-height there and bind node 245:2900. The case-study pages still state 630px as a literal.
      padding: { token: spacing/gap/medium, value: 16px }
      background: { token: non-interactive/background/primary, value: "#060805" }
  frame:
    notes: |-
      The window onto the artwork: fills the hero inside the 16px inset, radius/xlarge corners, overflow hidden (clip-path inset round when the media uses position:fixed descendants).
    styles:
      border-radius: { token: spacing/radius/xlarge, value: 24px }
      background:
        token: non-interactive/background/secondary
        value: "#171717"
        notes: |-
          The underlay the dimmed artwork composites onto. MUST be the same on every case study: the same media opacity reads darker on a darker surface (this is exactly the bug unified on 2026-10-18 — three heroes sat on #060805 and looked darker at identical opacity).
  media:
    notes: |-
      The artwork layer: a background-image div, never an <img> (background-attachment needs a background).
    styles:
      opacity:
        token: opacity/medium
        value: "0.48"
        notes: "Unified hero dim, decided 2026-10-18. DIVERGES from the Figma node, which specifies 32% (opacity/mild) — Figma not yet updated. The perceived dim is opacity x underlay, so this value only holds together with the frame's #171717."
      background-attachment:
        value: fixed
        notes: |-
          Pinned parallax: the artwork is pinned to the viewport and the page scrolls over it (the Paper pattern). Touch devices and prefers-reduced-motion fall back to background-attachment: scroll with background-size: cover and center position — static, element-anchored.
      background-size:
        value: explicit px (asset-native, e.g. 2336px 1196px)
        notes: |-
          NEVER `cover` together with `fixed`: a fixed background sizes against the viewport, not the frame, which magnifies the artwork (the bug that got `fixed` removed from one case-study hero the first time). Vector artwork may be sized at 2x its natural box for crispness.
        untokenised: Each artwork's native pixel size.
guidance:
  status: proposed
  use:
    - At the top of every case study on runceanu.com. One per page.
  avoid:
    - For the home page hero, which uses the **Paper effect** instead of artwork.
  behaviour: |-
    The artwork is pinned to the viewport (`background-attachment: fixed`) and the page scrolls over it. Touch devices and `prefers-reduced-motion` get a static, element-anchored background instead. The dim only holds as opacity *and* underlay together: never change one without the other.
  accessibility:
    artwork: a background image, so it is decorative by construction. Anything the reader needs from it goes in the text.
    contrast: text over the hero is checked against the dimmed artwork, not the underlay colour.
    motion: |-
      pinned parallax is turned off under `prefers-reduced-motion`.
deviations:
  - what: "Media opacity is opacity/medium (0.48) on a #171717 frame underlay; the Figma node specifies 32% (opacity/mild)."
    why: |-
      Unified hero dim decided 2026-10-18 across all case studies: perceived dim is opacity × underlay, and three heroes read darker at the same opacity. Figma not yet updated.
    raisedWithDesign: false
