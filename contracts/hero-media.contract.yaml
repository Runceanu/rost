# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: hero-media
name: Hero Media
kind: pattern
status: review
summary: |-
  The full-width hero on every case study: artwork pinned behind a 16px frame and dimmed to the same level everywhere.
category: surfaces
related: [ effect-paper ]
source:
  tool: figma
  fileKey: pg02BcqlCQCVt6LzTAiPhD
  nodeId: "245:2900"
  url: https://www.figma.com/design/pg02BcqlCQCVt6LzTAiPhD/?node-id=245-2900
  extractedAt: "2026-10-18"
  extractedBy: mcp
  frozenAt: "2026-10-20"
elements:
  hero:
    notes: |-
      The full-width section, 630px tall, on `non-interactive/background/primary`. Its 16px padding is the frame that shows the page around the image. The width has to take off the real scrollbar (100vw includes it), otherwise the sides look about 8px while the top is 16.
    styles:
      height:
        token: spacing/layout/hero-height
        value: 630px
        notes: |-
          I created this token in code on 2026-10-19 (`tokens.css`). Figma has no variable for it, and now that the contracts are the source, that's fine. The case-study pages still write 630px directly.
      padding: { token: spacing/gap/medium, value: 16px }
      background: { token: non-interactive/background/primary, value: "#060805" }
  frame:
    notes: |-
      The window onto the artwork. It fills the hero inside the 16px frame, with `radius/xlarge` corners, and hides anything that spills out (a rounded `clip-path` when the artwork uses fixed positioning).
    styles:
      border-radius: { token: spacing/radius/xlarge, value: 24px }
      background:
        token: non-interactive/background/secondary
        value: "#171717"
        notes: |-
          What the dimmed artwork sits on. It has to be the same on every case study. The same opacity looks darker on a darker surface, and that was exactly the bug I fixed on 2026-10-18: three heroes sat on #060805 and looked darker than the rest.
  media:
    notes: |-
      The artwork itself: a div with a background image, never an `<img>` (the pinned effect needs a background).
    styles:
      opacity:
        token: opacity/medium
        value: "0.48"
        notes: |-
          The one dim for every hero, decided on 2026-10-18. Figma still says 32% (`opacity/mild`), I went with 0.48. What you see is opacity times the colour underneath, so this only works together with the frame's #171717.
      background-attachment:
        value: fixed
        notes: |-
          The artwork stays pinned to the window while the page scrolls over it, the same idea as Paper. Phones, tablets and reduced motion get a normal background instead (`scroll`, `cover`, centred).
      background-size:
        value: explicit px (asset-native, e.g. 2336px 1196px)
        notes: |-
          Never `cover` together with `fixed`. A fixed background sizes itself against the window, not the frame, and blows the artwork up. That bug is why one case study lost the pinned effect the first time. Vector artwork can go at twice its natural size, so it stays sharp.
        untokenised: Each artwork's own pixel size. It changes with every image, so a token wouldn't help.
guidance:
  status: agreed
  use:
    - The top of every case study on runceanu.com. One per page.
  avoid:
    - The home page. That one has the **Paper effect** instead of artwork.
  behaviour: |-
    The artwork stays put and the page scrolls over it (`background-attachment: fixed`). Phones, tablets and `prefers-reduced-motion` get a normal static background instead. The dim only works as opacity *and* the colour underneath together. Never change one without the other.
  accessibility:
    artwork: it's a background image, so it's decoration by definition. Anything people need from it goes in the text.
    contrast: check the text against the dimmed artwork, not the colour underneath.
    motion: |-
      the pinned effect switches off with `prefers-reduced-motion`.
deviations:
  - what: |-
      The artwork is dimmed with `opacity/medium` (0.48) on a #171717 frame. Figma's node says 32% (`opacity/mild`).
    why: I set one dim for every case study on 2026-10-18. What you see is opacity times what's underneath, and three heroes looked darker at the same opacity. Figma never caught up.
    raisedWithDesign: false
