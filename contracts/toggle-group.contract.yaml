# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: toggle-group
name: ToggleGroup
kind: component
status: review
summary: A row of Toggles where one is chosen, like a year switcher. Arrow keys move the choice, and the row is one stop for Tab.
category: selection
related: [ toggle, tabs ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "528:742"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=528-742
  extractedAt: "2026-10-30"
  extractedBy: hand
  frozenAt: "2026-10-30"
props:
  label: { type: slot, notes: "What the choice is about, for screen readers: \"Tax year\". It's the group's `aria-label`; nothing is drawn." }
  toggles: { type: slot, notes: "The Toggle components, each with `role=\"radio\"` and `selected` on the chosen one. Figma's `toggles` slot, which prefers Toggle. In React, the children." }
elements:
  root:
    notes: "The `role=\"radiogroup\"`. No surface of its own: the toggles sit side by side."
    styles:
      display: { value: inline-flex, assert: false }
      align-items: { value: center }
      gap: { token: spacing/gap/3xsmall, value: 2px }
implementations:
  accounting-app:
    component: src/rost/toggle-group/ToggleGroup.tsx
    root: .rost-toggle-group
guidance:
  status: agreed
  use:
    - title: One of a few, straight away
      text: "Picking one of a few options that all fit on a line, where the choice applies straight away: a year, a view, a period."
      show: years, 2026 chosen
  avoid:
    - title: Too many options
      text: More options than fit on one line. That's a menu.
      show: years, 2026 chosen
    - title: Switching panels
      text: Switching panels of content under it. That's **Tabs**.
    - title: Several on at once
      text: Several things that can be on at once. Those are Toggles on their own, each `aria-pressed`.
  behaviour: |-
    One toggle is on at a time. Choosing another turns the last one off. The group draws nothing itself; each Toggle shows its own on and off.

    In Figma it has a page of its own: a component with a `toggles` slot of Toggle instances. Figma's Toggle has no label yet, so the Figma group shows three icon toggles, not years.
  accessibility:
    element: "`role=\"radiogroup\"` holding Toggles with `role=\"radio\"` and `aria-checked`. Toggle sets `aria-checked` itself when it has `role=\"radio\"`."
    name: "`label` becomes the group's `aria-label`. A Toggle with only an icon still needs its own `aria-label`."
    keyboard: "Tab lands on the chosen toggle, and the next Tab leaves the group. Arrow keys move to the next or previous toggle and choose it, Home and End go to the first and last, as the ARIA radio group pattern has it. Disabled toggles are skipped."
    focus: Each Toggle's own focus ring, on `:focus-visible`.
  content: Short labels of about the same length, so the row reads as one set.
