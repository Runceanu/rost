# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: tabs
name: Tabs
kind: component
status: review
summary: A row of tabs on a 1px line. One is selected, and its panel shows below.
category: navigation
related: [ tab-item, divider ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "448:56"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=448-56
  extractedAt: "2026-10-23"
  extractedBy: mcp
props:
  tabs: { type: slot, notes: "The tab-items, in Figma's `tab-items` slot: add, remove or reorder them. In React, the TabItem components as children." }
elements:
  root:
    notes: "The `role=\"tablist\"`. The tabs sit side by side, with nothing between them."
    styles:
      display: { value: flex, assert: false }
      align-items: { value: flex-start }
      gap: { value: 0px, assert: false }
      box-shadow:
        value: inset 0 calc(-1 * var(--spacing-outline-small)) 0 0 var(--tabs-line)
        untokenised: "Figma's 1px line along the bottom, drawn inside so the row stays 40px tall and the selected tab's underline sits on top of it. The width and colour are tokens (spacing/outline/small, tabs/line)."
guidance:
  status: agreed
  use:
    - title: Above its panels
      text: Above the panels it switches between.
      show: tabs
  avoid:
    - title: Too many tabs
      text: More tabs than fit on one line. Fewer, or a menu.
      show: tabs
  behaviour: |-
    One tab is selected at a time. Changing it swaps the panel below; nothing else on the page moves.
  accessibility:
    element: "`role=\"tablist\"` holding the tabs. Each panel is a `role=\"tabpanel\"` labelled by its tab."
    name: an `aria-label` on the tablist that says what it switches, like "Example".
    keyboard: Tab lands on the selected tab and the next Tab goes into its panel. Arrow keys, Home and End move between tabs (see **TabItem**).
    focus: on the tabs themselves, each with its own `focus-ring`.
  content: Tabs that belong together, in the order people need them.
