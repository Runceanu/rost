# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: chips
name: Chip
kind: component
status: review
summary: A small outlined label you can click, for filters and quick choices.
category: selection
related: [ tags, badge, toggle ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "139:317"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=139-317
  extractedAt: "2026-08-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
props:
  status:
    type: enum
    values: [ Default ]
    default: Default
  selected:
    type: boolean
    default: false
    notes: "Proposed, and in Figma since 2026-10-30 (the set's second column). The chip that's on, in a row of filters: ListItem's solid green plate, with the same `interactive/active` tokens. In code it also sets `aria-pressed`."
states: [ Default, Hover, Pressed, Focus, Disabled ]
elements:
  root:
    styles:
      justify-content: { value: center }
      align-items: { value: center }
      display: { value: inline-flex, assert: false }
      vertical-align: { value: middle, assert: false }
      position: { value: relative, assert: false }
      background: { value: none, assert: false, notes: "It's a `<button>`. The browser's own fill and border go; the outline part draws the edge." }
      border: { value: none, assert: false }
      font: { value: inherit, assert: false }
      cursor: { value: pointer, assert: false }
      outline: { value: none, assert: false }
      gap: { token: spacing/gap/small, value: 8px }
      height: { token: spacing/size/small, value: 24px }
      padding-bottom: { token: spacing/gap/3xsmall, value: 2px }
      padding-top: { token: spacing/gap/none, value: 0px }
      padding-left: { token: spacing/gap/small, value: 8px }
      padding-right: { token: spacing/gap/small, value: 8px }
      border-radius: { token: spacing/radius/full, value: 10000px }
  label:
    styles:
      flex-shrink: { value: "0", assert: false }
      white-space: { value: nowrap, assert: false }
      text-align: { value: center }
      position: { value: relative, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/label/font-weight/medium, value: "500" }
      line-height: { token: typography/label/line-height, value: 14px }
      font-size: { token: typography/label/font-size, value: 12px }
      letter-spacing: { token: typography/label/letter-spacing, value: 0px }
  background:
    notes: "Proposed, in Figma since 2026-10-30. The plate behind a selected chip, the full size of the pill. An unselected chip leaves it empty, so the Figma states don't change."
    styles:
      position: { value: absolute }
      inset: { value: "0" }
      border-radius: { token: spacing/radius/full, value: 10000px }
      pointer-events: { value: none, assert: false }
  outline:
    notes: "The 1px edge, drawn as an inset shadow rather than a border. Chrome spreads a border on a fully round box over two pixels at the ends, where Figma draws one. That was all of Pressed's difference from Figma (2.62%, now 0.68%)."
    styles:
      position: { value: absolute }
      inset: { value: "0" }
      border-radius: { token: spacing/radius/full, value: 10000px }
      pointer-events: { value: none, assert: false }
  focus-ring:
    styles:
      display: { value: none, assert: false }
      position: { value: absolute }
      inset: { value: "calc(-1 * var(--spacing-gap-2xsmall))", untokenised: "Composed from a token: the ring sits spacing/gap/2xsmall outside the element." }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      border-color: { token: actions/secondary/regular/focus/focus-ring, value: "#999" }
      border-radius: { token: spacing/radius/full, value: 10000px }
      pointer-events: { value: none, assert: false }
variants:
  - when: { status: Default, state: Default }
    figmaNode: "139:318"
    elements:
      label:
        color: { token: actions/secondary/regular/default/label, value: "#d3d9d5" }
      outline:
        box-shadow:
          value: inset 0 0 0 var(--spacing-outline-small) var(--actions-secondary-regular-default-outline)
          untokenised: "Figma's 1px stroke, drawn inside the shape. The width and colour are tokens (spacing/outline/small, actions/secondary/regular/default/outline)."
        opacity: { token: opacity/gentle, value: "0.24" }
  - when: { status: Default, state: Hover }
    figmaNode: "139:320"
    elements:
      label:
        color: { token: actions/secondary/regular/hover/label, value: "#ededed" }
      outline:
        box-shadow:
          value: inset 0 0 0 var(--spacing-outline-small) var(--actions-secondary-regular-hover-outline)
          untokenised: "Figma's 1px stroke, drawn inside the shape. The width and colour are tokens (spacing/outline/small, actions/secondary/regular/hover/outline)."
        opacity: { token: opacity/strong, value: "0.64" }
  - when: { status: Default, state: Pressed }
    figmaNode: "139:322"
    elements:
      label:
        color: { token: actions/secondary/regular/pressed/label, value: "#d3d9d5" }
      outline:
        box-shadow:
          value: inset 0 0 0 var(--spacing-outline-small) var(--actions-secondary-regular-pressed-outline)
          untokenised: "Figma's 1px stroke, drawn inside the shape. The width and colour are tokens (spacing/outline/small, actions/secondary/regular/pressed/outline)."
        opacity: { token: opacity/solid, value: "1" }
  - when: { status: Default, state: Disabled }
    figmaNode: "139:324"
    elements:
      label:
        color: { token: actions/secondary/regular/disabled/label, value: "#d3d9d5" }
      outline:
        box-shadow:
          value: inset 0 0 0 var(--spacing-outline-small) var(--actions-secondary-regular-disabled-outline)
          untokenised: "Figma's 1px stroke, drawn inside the shape. The width and colour are tokens (spacing/outline/small, actions/secondary/regular/disabled/outline)."
        opacity: { token: opacity/solid, value: "1" }
      root:
        opacity: { token: opacity/gentle, value: "0.24" }
        cursor: { value: default, assert: false }
  - when: { status: Default, state: Focus }
    figmaNode: "139:326"
    elements:
      label:
        color: { token: actions/secondary/regular/focus/label, value: "#d3d9d5" }
      outline:
        box-shadow:
          value: inset 0 0 0 var(--spacing-outline-small) var(--actions-secondary-regular-focus-outline)
          untokenised: "Figma's 1px stroke, drawn inside the shape. The width and colour are tokens (spacing/outline/small, actions/secondary/regular/focus/outline)."
        opacity: { token: opacity/gentle, value: "0.24" }
      focus-ring:
        display: { value: block, assert: false }
  # Proposed: the selected chip, drawn after ListItem's selected row. Drawn in code first, in Figma since 2026-10-30.
  # These come after the Figma states so they win over them.
  - when: { state: Default, selected: true }
    figmaNode: "527:484"
    elements:
      background:
        background: { token: interactive/active/default/background, value: "#00d669" }
      label:
        color: { token: interactive/active/default/label, value: "#060805" }
      outline:
        opacity: { token: opacity/transparent, value: "0", notes: "A selected chip has no edge, like a selected ListItem. The plate is the edge." }
  - when: { state: Hover, selected: true }
    figmaNode: "527:488"
    elements:
      background:
        background: { token: interactive/active/hover/background, value: "#00b450" }
      label:
        color: { token: interactive/active/hover/label, value: "#060805" }
      outline:
        opacity: { token: opacity/transparent, value: "0", notes: "A selected chip has no edge, like a selected ListItem. The plate is the edge." }
  - when: { state: Pressed, selected: true }
    figmaNode: "527:492"
    elements:
      background:
        background: { token: interactive/active/pressed/background, value: "#00913a" }
      label:
        color: { token: interactive/active/pressed/label, value: "#060805" }
      outline:
        opacity: { token: opacity/transparent, value: "0", notes: "A selected chip has no edge, like a selected ListItem. The plate is the edge." }
  - when: { state: Focus, selected: true }
    figmaNode: "527:496"
    elements:
      background:
        background: { token: interactive/active/focus/background, value: "#00d669" }
      label:
        color: { token: interactive/active/focus/label, value: "#060805" }
      outline:
        opacity: { token: opacity/transparent, value: "0", notes: "A selected chip has no edge, like a selected ListItem. The plate is the edge." }
      focus-ring:
        display: { value: block, assert: false }
        border-color: { token: interactive/active/focus/focus-ring, value: "#b6ffda" }
  - when: { state: Disabled, selected: true }
    figmaNode: "527:501"
    elements:
      background:
        background: { token: interactive/active/disabled/background, value: "#00d669" }
      label:
        color: { token: interactive/active/disabled/label, value: "#060805" }
      outline:
        opacity: { token: opacity/transparent, value: "0", notes: "A selected chip has no edge, like a selected ListItem. The plate is the edge." }
      root:
        opacity: { token: opacity/gentle, value: "0.24" }
        cursor: { value: default, assert: false }
guidance:
  status: agreed
  use:
    - title: Filters and quick choices
      text: "Used for filters and quick choices in a row: categories, date ranges."
      show: state=Default, selected=True
  avoid:
    - title: A status
      text: "A status nobody clicks: **Badge**."
    - title: A topic
      text: "A topic on a piece of content: **Tag**."
  behaviour: |-
    One `status` (`Default`) and five states. Hover, pressed and focus come from the browser.

    `selected` is the chip that's on: a solid green plate with a dark label, the same look and tokens as a selected ListItem, and no edge. It's my proposal. I drew it in code first and then in the kit, in the Chip set's second column. Use it, but it isn't signed off yet. Don't improvise another fill.
  accessibility:
    element: |-
      `<button type="button">`, with `aria-pressed` when it filters. Pass `selected` (true or false) and Chip sets `aria-pressed` for you. Leave it out on a chip that just does something, and there's no `aria-pressed` at all.
    group: |-
      wrap the set in something with a name (`role="group"` and `aria-label="Filter by category"`).
    focus: "`focus-ring`, on `:focus-visible`."
  content: One or two words, sentence case.
implementations:
  portfolio-site:
    component: src/rost/chips/Chip.tsx
    root: .rost-chips
    deviations:
      - what: |-
          Drawn as a `<span>` (`as="span"`) in the case-study meta, with no hover, press or cursor.
        why: |-
          Nobody clicks those. The guidance says a static topic is a Tag, but the site's design has the outlined chip there, so I kept the look and took the states off.
        raisedWithDesign: false
