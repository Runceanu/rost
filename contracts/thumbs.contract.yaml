# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: thumbs
name: Thumbs
kind: component
status: review
summary: A project thumbnail card, with the project name and details on a frosted panel at the bottom.
category: display
related: [ projects, carousel, badge ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "109:79"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=109-79
  extractedAt: "2026-10-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
props:
  name:
    type: slot
    notes: The project's name, in the title. In React, `name`.
  number:
    type: slot
    notes: A two-digit index in front of the name.
  industry: { type: slot }
  type: { type: slot, notes: "What kind of work it was. In React it's `kind`, so it can't be mistaken for a button's type." }
  period: { type: slot }
  showNumber: { type: boolean, default: true }
  showName: { type: boolean, default: true }
  showIndustry: { type: boolean, default: true }
  showType: { type: boolean, default: true, notes: "In React it's `showKind`, after `kind`." }
  showPeriod: { type: boolean, default: true }
  image:
    type: slot
    notes: What fills the card. In Figma, the empty `slot` frame. In React, the children.
  badge:
    type: slot
    notes: The pill on a disabled card, "Coming soon" in Figma. It's Rost's Badge, Medium, Default.
states: [ Default, Hover, Pressed, Focus, Disabled, Locked ]
elements:
  root:
    styles:
      display: { value: flex, assert: false }
      flex-direction: { value: column, assert: false }
      align-items: { value: flex-start }
      position: { value: relative, assert: false }
      gap: { token: spacing/gap/none, value: 0px }
      border-radius: { token: spacing/radius/xlarge, value: 24px }
      text-decoration: { value: none, assert: false, notes: "It's a link. The whole card is the target." }
      color: { value: inherit, assert: false }
      outline: { value: none, assert: false, notes: "The focus ring is its own part, drawn as Figma draws it." }
      height:
        value: 334px
        assert: false
        notes: Just the size of the Figma frame. No token, and not something to copy.
      width:
        value: 384px
        assert: false
        notes: Just the size of the Figma frame. No token, and not something to copy.
  slot:
    styles:
      flex: { value: 1 0 0, assert: false }
      min-height: { value: 1px, assert: false }
      width: { value: 100% }
      position: { value: relative, assert: false }
      overflow: { value: hidden, assert: false, notes: An image inside keeps the card's corners. }
      background: { token: thumbs/slot, value: "#171717" }
      border-radius: { token: spacing/radius/xlarge, value: 24px }
  shadow:
    styles:
      position: { value: absolute }
      left: { value: "0" }
      right: { value: "0" }
      bottom: { value: "0" }
      height:
        value: 50%
        notes: 167px in Figma, half of the 334px frame. Half is the decision, so it holds at any size.
      background:
        value: linear-gradient(to bottom, transparent, var(--thumbs-shade))
        untokenised: "A gradient from nothing to the page colour. It starts at `transparent`, which browsers blend with the alpha first, so it fades into the page in either theme. The colour is the token; the ramp is the effect."
      opacity: { token: opacity/medium, value: "0.48" }
      border-bottom-left-radius: { token: spacing/radius/xlarge, value: 24px }
      border-bottom-right-radius: { token: spacing/radius/xlarge, value: 24px }
      pointer-events: { value: none, assert: false }
  content:
    styles:
      position: { value: absolute }
      left: { token: spacing/gap/small, value: 8px }
      right: { token: spacing/gap/small, value: 8px }
      bottom: { token: spacing/gap/small, value: 8px }
      display: { value: flex, assert: false }
      flex-direction: { value: column, assert: false }
      align-items: { value: flex-start }
      background: { value: "color-mix(in srgb, var(--thumbs-panel) calc(var(--opacity-medium) * 100%), transparent)", untokenised: "Composed from tokens: the page background at opacity/medium. It was base/black, which stays black in light while the text on it goes dark." }
      backdrop-filter: { token: effect/thumb, value: blur(12px) }
      gap: { token: spacing/gap/small, value: 8px }
      padding-bottom: { token: spacing/gap/large, value: 24px }
      padding-top: { token: spacing/gap/medium, value: 16px }
      padding-left: { token: spacing/gap/medium, value: 16px }
      padding-right: { token: spacing/gap/medium, value: 16px }
      border-radius: { token: spacing/radius/large, value: 16px }
  title:
    styles:
      align-items: { value: center }
      display: { value: flex, assert: false }
      flex-shrink: { value: "0", assert: false }
      width: { value: 100% }
      position: { value: relative, assert: false }
      gap: { token: spacing/gap/medium, value: 16px }
  number:
    styles:
      justify-content: { value: center }
      align-items: { value: center }
      display: { value: flex, assert: false }
      flex-shrink: { value: "0", assert: false }
      position: { value: relative, assert: false }
      width: { value: 16px, token: spacing/size/2xsmall }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/label/font-weight/regular, value: "400" }
      line-height: { token: typography/label/line-height, value: 14px }
      font-size: { token: typography/label/font-size, value: 12px }
      letter-spacing: { token: typography/label/letter-spacing, value: 0px }
  text:
    styles:
      flex-shrink: { value: "0", assert: false }
      white-space: { value: nowrap, assert: false }
      position: { value: relative, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/title/font-weight/medium, value: "500" }
      line-height: { token: typography/title/line-height, value: 32px }
      font-size: { token: typography/title/font-size, value: 24px }
      letter-spacing: { token: typography/title/letter-spacing, value: 0px }
  bottom:
    styles:
      align-items: { value: center }
      display: { value: flex, assert: false }
      flex-shrink: { value: "0", assert: false }
      justify-content: { value: flex-end }
      position: { value: relative, assert: false }
      gap: { token: spacing/gap/medium, value: 16px }
      padding-left: { token: spacing/gap/xlarge, value: 32px }
  detail:
    notes: Industry, type and period. Figma calls each one a label; the number's label is styled apart, because on hover the two go different colours.
    styles:
      flex-shrink: { value: "0", assert: false }
      white-space: { value: nowrap, assert: false }
      position: { value: relative, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/label/font-weight/regular, value: "400" }
      line-height: { token: typography/label/line-height, value: 14px }
      font-size: { token: typography/label/font-size, value: 12px }
      letter-spacing: { token: typography/label/letter-spacing, value: 0px }
  icons-dot:
    notes: Figma's 12px `icons/dot`, a 3px dot in the middle. Drawn in CSS so its colour can follow the state.
    styles:
      display: { value: flex, assert: false }
      align-items: { value: center }
      justify-content: { value: center }
      flex-shrink: { value: "0", assert: false }
      position: { value: relative, assert: false }
      width: { value: 12px, token: spacing/size/3xsmall }
      height: { value: 12px, token: spacing/size/3xsmall }
  dot:
    styles:
      width: { value: 3px, untokenised: "The dot's own size inside the icon." }
      height: { value: 3px, untokenised: "The dot's own size inside the icon." }
      border-radius: { token: spacing/radius/full, value: 10000px }
  focus-ring:
    styles:
      display: { value: none, assert: false }
      position: { value: absolute }
      inset: { value: "calc(-1 * var(--spacing-gap-2xsmall))", untokenised: "Composed from a token: the ring sits spacing/gap/2xsmall outside the element." }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      border-color: { token: thumbs/focus-ring, value: "#999" }
      border-radius:
        value: "calc(var(--spacing-radius-xlarge) + var(--spacing-gap-2xsmall))"
        untokenised: "Composed from tokens: the element's spacing/radius/xlarge plus the ring's spacing/gap/2xsmall."
      pointer-events: { value: none, assert: false }
  badge:
    optional: true
    notes: Places the Badge in the corner. The pill itself is the Badge component.
    styles:
      position: { value: absolute }
      top: { token: spacing/gap/medium, value: 16px }
      right: { token: spacing/gap/medium, value: 16px }
      display: { value: flex, assert: false }
  locked:
    optional: true
    styles:
      position: { value: absolute }
      top: { token: spacing/gap/medium, value: 16px }
      right: { token: spacing/gap/medium, value: 16px }
      align-items: { value: center }
      display: { value: flex, assert: false }
      background: { token: thumbs/lock-plate, value: "#00d669" }
      gap: { token: spacing/gap/none, value: 0px }
      padding: { token: spacing/gap/small, value: 8px }
      border-radius: { token: spacing/radius/medium, value: 12px }
  icons-lock:
    optional: true
    notes: "Figma's lock, drawn as a mask in its colour, the same way as in Projects."
    styles:
      display: { value: block, assert: false }
      flex-shrink: { value: "0", assert: false }
      position: { value: relative, assert: false }
      width: { value: 24px, token: spacing/size/small }
      height: { value: 24px, token: spacing/size/small }
      background: { token: thumbs/lock, value: "#060805", notes: "Dark on the green in both themes, like a primary button's label. It was non-interactive/foreground/contrast, which turns white in light." }
      mask: { value: url(./icon-lock.svg) center / contain no-repeat, untokenised: The icon file itself. }
variants:
  - when: { state: Default }
    figmaNode: "109:78"
    elements:
      number:
        color: { token: thumbs/default/number, value: "#999" }
      text:
        color: { token: thumbs/default/label, value: "#d3d9d5" }
      detail:
        color: { token: thumbs/default/sub-label, value: "#999" }
      dot:
        background: { token: thumbs/default/dot, value: "#747573" }
  - when: { state: Hover }
    figmaNode: "109:77"
    elements:
      number:
        color: { token: thumbs/hover/number, value: "#00d669" }
      text:
        color: { token: thumbs/hover/label, value: "#00d669" }
      detail:
        color: { token: thumbs/hover/sub-label, value: "#ededed" }
      dot:
        background: { token: thumbs/hover/dot, value: "#ededed" }
  - when: { state: Pressed }
    figmaNode: "109:168"
    elements:
      number:
        color: { token: thumbs/pressed/number, value: "#00d669" }
      text:
        color: { token: thumbs/pressed/label, value: "#00d669" }
      detail:
        color: { token: thumbs/pressed/sub-label, value: "#c2c7c3" }
      dot:
        background: { token: thumbs/pressed/dot, value: "#c2c7c3" }
  - when: { state: Focus }
    figmaNode: "109:118"
    elements:
      number:
        color: { token: thumbs/focus/number, value: "#999" }
      text:
        color: { token: thumbs/focus/label, value: "#d3d9d5" }
      detail:
        color: { token: thumbs/focus/sub-label, value: "#999" }
      focus-ring:
        display: { value: block, assert: false }
      dot:
        background: { token: thumbs/focus/dot, value: "#747573" }
  - when: { state: Disabled }
    figmaNode: "109:206"
    elements:
      root:
        cursor: { value: default, assert: false }
      number:
        color: { token: thumbs/disabled/number, value: "#999" }
      text:
        color: { token: thumbs/disabled/label, value: "#d3d9d5" }
      detail:
        color: { token: thumbs/disabled/sub-label, value: "#999" }
      dot:
        background: { token: thumbs/disabled/dot, value: "#747573" }
      slot:
        opacity: { token: opacity/mild, value: "0.32" }
      content:
        opacity: { token: opacity/mild, value: "0.32" }
  - when: { state: Locked }
    figmaNode: "261:1232"
    elements:
      number:
        color: { token: thumbs/locked/number, value: "#999", notes: "Figma's Locked card uses the default tokens, not project/lock/*." }
      text:
        color: { token: thumbs/locked/label, value: "#d3d9d5" }
      detail:
        color: { token: thumbs/locked/sub-label, value: "#999" }
implementations:
  portfolio-site:
    component: src/rost/thumbs/Thumbs.tsx
    root: .rost-thumbs
    deviations:
      - what: |-
          Under 480px a name too long for its card wraps instead of staying on one line. It keeps `typography/title` at every width. The /built page does the same at every width.
        why: |-
          Names like OneDS Instruments Artboard Creator don't fit a phone-width card on one line, and shrinking the type would leave Rost's scale.
        raisedWithDesign: false
guidance:
  status: agreed
  use:
    - title: A card that links
      text: Used as a card for one project or item in a grid or a carousel. The whole card links to the details.
      show: state=Default
    - title: A picture and a few facts
      text: A list of things that each want a picture and a short line of facts under a name.
      show: state=Locked
  avoid:
    - title: A card that isn't a link
      text: A card that isn't a link. Thumbs has hover, pressed and focus because it's meant to be clicked.
      show: state=Disabled
    - title: Long names
      text: Long names. The title doesn't wrap, by design. Two or three words.
      show: state=Default
  behaviour: |-
    The picture fills the card, and the frosted panel sits on its bottom edge with the number, the name and three details. On hover and pressed the name and number go green, and the details lighten. `Disabled` dims the picture and the panel and shows the badge ("Coming soon"). `Locked` keeps the card as it is and puts a green lock in the corner, for work I can't show without a password.
  accessibility:
    element: an `<a>`. Disabled drops the `href` and sets `aria-disabled="true"`.
    name: the link's text, which is the number, the name and the details read in order. Pass `aria-label` if that reads badly.
    keyboard: Tab to it, Enter opens it.
    focus: a 2px ring, 4px outside the card, on `:focus-visible` only.
    colour: Locked says it with the lock icon, which has its own text ("Locked") for screen readers.
  content: The name is the client or the product, as people know it. Details are a word or two each, the period like "2024" or "2023 to 2025".
