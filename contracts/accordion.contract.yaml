# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: accordion
name: Accordion
kind: component
status: review
summary: "Several things that open one by one, like questions and answers: Disclosures in a column, a line between each."
category: surfaces
related: [ disclosure, description-list ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "745:29"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=745-29
  extractedAt: "2026-11-16"
  extractedBy: hand
  frozenAt: "2026-11-16"
props:
  items: { type: slot, required: true, notes: "Each a summary and what opens." }
elements:
  root:
    notes: "A `<div>` holding the items in a column."
    styles:
      display: { value: flex, assert: false }
      flex-direction: { value: column, assert: false }
  item:
    notes: "A Disclosure, as it is, with 12px above and below and a 1px line under it."
    styles:
      padding-top: { token: spacing/gap/small-medium, value: 12px }
      padding-bottom: { token: spacing/gap/small-medium, value: 12px }
      border-bottom-style: { value: solid, assert: false }
      border-bottom-width: { token: spacing/outline/small, value: 1px }
      border-bottom-color: { token: accordion/divider, value: "#3a3a3a" }
guidance:
  status: proposed
  use:
    - title: Questions and answers
      text: "A few questions where most people need one answer: what counts as a business expense, when tax is due."
  avoid:
    - title: Things everyone needs
      text: "If most people open every item, show them open."
    - title: One thing to hide
      text: "A single detail out of the way is one **Disclosure**."
  behaviour: "Each item opens on its own; opening one doesn't close the others. It's Disclosures in a column with lines between them."
  accessibility:
    element: "A `<div>` of `<details>`, so each summary is a button the browser knows opens."
    keyboard: "Tab moves between summaries; Enter or Space opens and closes."
    colour: "The lines are decoration."
