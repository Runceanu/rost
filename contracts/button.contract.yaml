# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: button
name: Button
kind: component
status: stable
summary: A 48px button with a label and, if it helps, an icon in front. In four levels of emphasis.
category: actions
related: [ icon-button, toggle ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "20:14"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=20-14
  extractedAt: "2026-08-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
props:
  icon: { type: slot, notes: "Optional, in front of the label: a 20px icon in the label's colour. Figma's `leading` slot, off by default." }
  type:
    type: enum
    values: [ Borderless, Primary, Secondary, Tertiary ]
    default: Primary
    notes: "In React it's `variant`, so it can't be mistaken for a `<button>`'s own `type`. Figma's set lists Borderless first; a Button that says nothing is the main action, so the default is Primary."
states: [ Default, Hover, Pressed, Focus, Disabled ]
stateSelectors:
  Pressed: ":is(:active, [aria-current=\"page\"])"
elements:
  root:
    styles:
      justify-content: { value: center }
      align-items: { value: center }
      display: { value: inline-flex, assert: false }
      vertical-align: { value: middle, assert: false }
      position: { value: relative, assert: false }
      background: { value: none, assert: false, notes: "A `<button>` or a link. The browser's own look goes; each type draws its own." }
      border: { value: none, assert: false }
      font: { value: inherit, assert: false }
      text-decoration: { value: none, assert: false }
      cursor: { value: pointer, assert: false }
      outline: { value: none, assert: false }
      gap: { token: spacing/gap/small, value: 8px }
      height: { token: spacing/size/medium-large, value: 48px }
      border-radius: { token: spacing/radius/full, value: 10000px }
  label:
    styles:
      flex-shrink: { value: "0", assert: false }
      white-space: { value: nowrap, assert: false }
      text-align: { value: center }
      position: { value: relative, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/body/font-weight/medium, value: "500" }
      line-height: { token: typography/body/line-height, value: 22px }
      font-size: { token: typography/body/font-size, value: 16px }
      letter-spacing: { token: typography/body/letter-spacing, value: 0px }
  icons-arrow-left:
    optional: true
    styles:
      display: { value: flex, assert: false }
      align-items: { value: center }
      justify-content: { value: center }
      overflow: { value: clip }
      flex-shrink: { value: "0", assert: false }
      position: { value: relative, assert: false }
      width: { value: 20px, token: spacing/size/xsmall }
      height: { value: 20px, token: spacing/size/xsmall }
  union:
    optional: true
    styles:
      position: { value: absolute }
      inset: { value: 20.84% 16.66% 20.83% 18.4% }
  focus-ring:
    styles:
      display: { value: none, assert: false }
      border-style: { value: solid }
      pointer-events: { value: none, assert: false }
  background:
    notes: The fill under Secondary, Tertiary and Borderless, drawn see-through on its own layer so the label stays solid.
    styles:
      position: { value: absolute }
      inset: { value: "0" }
      pointer-events: { value: none, assert: false }
