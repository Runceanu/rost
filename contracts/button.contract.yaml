guidance:
  status: agreed
  use:
    - title: Doing something
      text: "Doing something: save, send, continue, open."
      show: type=Primary, state=Default
    - title: The main action
      text: "`Primary` for the one thing a screen is really about. One per screen, no more."
      show: type=Primary, state=Default
    - title: The other actions
      text: "`Secondary` for the options next to it, `Tertiary` when little is at stake, `Borderless` in busy places where an outline would just be noise."
      show: type=Secondary, state=Default
    - title: With an icon
      text: "An icon when it helps people get it faster: a back arrow, an external link, a download."
      show: with an icon
  avoid:
    - title: Icons for decoration
      text: When the icon is just decoration. Leave it out.
      show: with an icon
    - title: No room for a label
      text: When there's no room for the label. That's **IconButton**, never a Button with its label hidden.
    - title: Picking an option
      text: Picking between options. That's **Toggle** or **Chip**.
  behaviour: |-
    `type` sets how loud it is. `state` is never something you pass in code: hover, pressed and focus come from `:hover`, `:active` and `:focus-visible`. Disabled is the only one you set yourself. The whole button fades to `opacity/gentle`, label and all. In a nav, the page you're on wears the pressed look (`aria-current="page"`): it reads as chosen, not as broken. The icon sits in a 20px slot (`icons-arrow-left` in Figma) and takes the label's colour.
  accessibility:
    element: |-
      `<button type="button">`, `type="submit"` inside a form, or `<a>` when it takes you somewhere. A button that navigates is still a link, so it keeps open-in-new-tab and the back button.
    name: |-
      the label people see. Don't swap it for an `aria-label` that says something else. The icon is `aria-hidden="true"`.
    keyboard: Enter, and Space for buttons.
    focus: the `focus-ring` part, 2px, only on `:focus-visible`.
    disabled: |-
      I'd rather use `aria-disabled="true"` with a short reason nearby than `disabled`. `disabled` drops the button out of the tab order and nobody can find out why it doesn't work.
  content: |-
    A verb, sentence case, two or three words. "Save changes", not "OK" or "SUBMIT". Say what will happen. An icon has to match the words: an arrow pointing left only on "Back".
deviations:
  - what: |-
      Figma has Button twice: the set at 20:14 (PillButton, with a `leading` icon slot that's off by default) and the one at 39:38 (Button, label only). Rost has one Button with an optional icon, built from 20:14.
    why: |-
      They have the same height, types, states and tokens. The other differences were layer names (`text` against `label`) and the Primary stroke, which is an inset shadow here because it takes no space. 20:14's screenshots all match; 39:38's came back empty. Merged on 2026-10-23.
    raisedWithDesign: false
implementations:
  portfolio-site:
    component: src/rost/button/Button.tsx
    root: .rost-button
    deviations:
      - what: |-
          On a phone the homepage hero's two Buttons stretch to the full width of the column. Under 420px the nav drops its Book an intro Button, which every page has in its own body.
        why: |-
          Two hugging buttons side by side don't fit a phone, and the nav's three Buttons need 384px. Rost's Button doesn't shrink, so the layout gives way instead.
        raisedWithDesign: false
  accounting-app:
    component: src/rost/button/Button.tsx
    root: .rost-button
