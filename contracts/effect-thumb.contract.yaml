# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: effect-thumb
name: Thumb
kind: effect
status: review
summary: The frosted panel on project thumbnails, a backdrop blur.
category: effects
related: [ effect-menu, effect-lock-frame ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "124:26634"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=124-26634
  extractedAt: "2026-08-19"
  extractedBy: mcp
elements:
  root:
    notes: |-
      Whatever the style is applied to: the frosted text panel on a project thumbnail. Thumbs and Carousel both use it.
    styles:
      backdrop-filter:
        token: effect/thumb
        value: blur(12px)
        notes: |-
          The Figma effect style "Thumb": frosted glass, so it blurs what's behind the element. In Figma its blur is tied to `opacity/gentle` (24), and CSS draws it at 12px because a Figma background blur is about twice its CSS size. One thing I don't love: `opacity/gentle` is an opacity token (0.24) borrowed here as a blur size. Its own blur token would be cleaner. In code the whole effect is `--effect-thumb`, and that's the token the contract checks.
guidance:
  status: proposed
  use:
    - The text panel on a project thumbnail, in Thumbs and Carousel.
  avoid:
    - Navigation. That's the **Menu effect**.
  behaviour: |-
    It blurs what's behind the panel. In Figma the blur is tied to `opacity/gentle`, an opacity token borrowed as a blur size. It works, but changing that opacity would also move this blur. Its own blur token would fix it.
  accessibility:
    contrast: check the panel text against the busiest part of the thumbnail.
