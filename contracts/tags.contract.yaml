# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: tags
name: Tag
kind: component
status: review
summary: A compact 20px label with small corners, for what a piece of content is about.
category: display
related: [ chips, badge ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "91:362"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=91-362
  extractedAt: "2026-08-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
props:
  type:
    type: enum
    values: [ Primary ]
    default: Primary
statesOn: ":is(a[href], button)"
states: [ Default, Hover, Pressed, Focus, Disabled ]
elements:
  root:
    styles:
      justify-content: { value: center }
      align-items: { value: center }
      display: { value: inline-flex, assert: false }
      vertical-align: { value: middle, assert: false }
      position: { value: relative, assert: false }
      text-decoration: { value: none, assert: false }
      gap: { token: spacing/gap/small, value: 8px }
      height: { token: spacing/size/xsmall, value: 20px }
      padding-bottom: { token: spacing/gap/3xsmall, value: 2px }
      padding-top: { token: spacing/gap/none, value: 0px }
      padding-left: { token: spacing/gap/small, value: 8px }
      padding-right: { token: spacing/gap/small, value: 8px }
      border-radius: { token: spacing/radius/xsmall, value: 4px }
      background: { token: actions/secondary/regular/default/background, value: "#3a3a3a" }
      outline: { value: none, assert: false }
  label:
    notes: Figma calls it `text` in every state but Default. It's the same layer.
    styles:
      flex-shrink: { value: "0", assert: false }
      white-space: { value: nowrap, assert: false }
      text-align: { value: center }
      position: { value: relative, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/label/font-weight/medium, value: "500" }
      line-height: { token: typography/label/line-height, value: 14px }
      color: { token: actions/secondary/regular/default/label, value: "#d3d9d5" }
      font-size: { token: typography/label/font-size, value: 12px }
      letter-spacing: { token: typography/label/letter-spacing, value: 0px }
  focus-ring:
    styles:
      display: { value: none, assert: false }
      position: { value: absolute }
      inset: { value: "calc(-1 * var(--spacing-gap-2xsmall))", untokenised: "Composed from a token: the ring sits spacing/gap/2xsmall outside the element." }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      border-color: { token: actions/secondary/regular/focus/focus-ring, value: "#999" }
      border-radius: { token: spacing/radius/small, value: 8px }
      pointer-events: { value: none, assert: false }
variants:
  - when: { type: Primary, state: Default }
    figmaNode: "91:363"
  - when: { type: Primary, state: Hover }
    figmaNode: "91:372"
    elements:
      root:
        background: { token: actions/secondary/regular/hover/background, value: "#747573" }
      label:
        color: { token: actions/secondary/regular/hover/label, value: "#ededed" }
  - when: { type: Primary, state: Pressed }
    figmaNode: "91:383"
    elements:
      root:
        background: { token: actions/secondary/regular/pressed/background, value: "#999" }
      label:
        color: { token: actions/secondary/regular/pressed/label, value: "#d3d9d5" }
  - when: { type: Primary, state: Focus }
    figmaNode: "91:403"
    elements:
      root:
        background: { token: actions/secondary/regular/focus/background, value: "#3a3a3a" }
      label:
        color: { token: actions/secondary/regular/focus/label, value: "#d3d9d5" }
      focus-ring:
        display: { value: block, assert: false }
  - when: { type: Primary, state: Disabled }
    figmaNode: "91:394"
    elements:
      root:
        background: { token: actions/secondary/regular/disabled/background, value: "#3a3a3a" }
        opacity: { token: opacity/gentle, value: "0.24" }
      label:
        color: { token: actions/secondary/regular/disabled/label, value: "#d3d9d5" }
guidance:
  status: agreed
  use:
    - title: What something is about
      text: "Used to say what something is about: a discipline, a platform, a topic."
      show: state=Default
  avoid:
    - title: A status or a filter
      text: "A status: **Badge**. A filter: **Chip**."
  behaviour: |-
    One `type` (`Primary`) and five states. The hover and press states are there for tags that link to a filtered list. A tag that doesn't go anywhere shouldn't have them.
  accessibility:
    static: |-
      a `<span>`, or `<li>` items in a `<ul>` when there are a few.
    linking: |-
      an `<a>` whose name gives the context ("Projects tagged Fintech").
    focus: "`focus-ring`, only on tags that link."
  content: One word if you can. Capitals only for proper nouns.
