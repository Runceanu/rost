# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: list-item
name: ListItem
kind: component
status: review
summary: One row you can pick in a list or a nav. A label, an optional line under it, and optional icons and a status dot.
category: navigation
related: [ badge, menu ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "346:3364"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=346-3364
  extractedAt: "2026-10-26"
  extractedBy: mcp
props:
  label: { type: slot, notes: "The item's name. In React, the children." }
  description: { type: slot, notes: "Optional, one short line under the label." }
  leading: { type: slot, notes: "Optional, a 20px icon before the text. Draw it with `currentColor`. Figma's `showLeading` and `Leading`." }
  badge: { type: boolean, default: false, notes: "Shows the status dot on the right. Figma's `showBadge`." }
  badgeStatus: { type: enum, values: [ Default, Negative, Positive, Warning ], default: Default, notes: "The dot's colour: the `status` of Figma's small Badge inside the row, with Badge's own dot colours. On a selected row at rest the status colour wins; while that row is hovered, pressed, focused or disabled the dot goes dark, as Figma has it." }
  action: { type: slot, notes: "Optional, a 20px icon at the end, usually a chevron. Draw it with `currentColor`. Figma's `showAction` and `Action`." }
  selected: { type: boolean, default: false, notes: "The one that's picked: a solid green plate." }
  iconOnly: { type: boolean, default: false, notes: "Set by the component when there's no label: just the icon, centred in a 48px square, as in a collapsed navigation. Not a Figma axis: Figma hides the text (`showContent`) on the instance." }
states: [ Default, Hover, Pressed, Focus, Disabled ]
elements:
  root:
    notes: "A link, or a `<button>`. Its text colours and the plate change with the state; the row itself has no fill."
    styles:
      display: { value: flex, assert: false }
      align-items: { value: center }
      position: { value: relative, assert: false }
      width: { value: 100%, untokenised: "As wide as its list. Figma's sample is 208px." }
      gap: { token: spacing/gap/small, value: 8px }
      padding-top: { token: spacing/gap/small, value: 8px }
      padding-bottom: { token: spacing/gap/small, value: 8px }
      padding-left: { token: spacing/gap/small-medium, value: 12px }
      padding-right: { token: spacing/gap/small-medium, value: 12px }
      min-height: { token: spacing/size/medium-large, value: 48px }
      border-radius: { token: spacing/radius/medium, value: 12px }
      background: { value: none, assert: false }
      border: { value: none, assert: false }
      font: { value: inherit, assert: false }
      text-align: { value: left, assert: false }
      text-decoration: { value: none, assert: false }
      cursor: { value: pointer, assert: false }
      outline: { value: none, assert: false }
  background:
    notes: "The plate, 4px in from the row's edge with 8px corners. Solid green when selected; on an unselected row only hover and press show it, faded."
    styles:
      position: { value: absolute, assert: false }
      inset: { value: 4px, untokenised: "Figma's own 4px inset of the plate." }
      border-radius: { token: spacing/radius/small, value: 8px }
      pointer-events: { value: none, assert: false }
  start:
    notes: "The icon and the text. Figma calls this layer `right`, although it's on the left."
    styles:
      display: { value: flex, assert: false }
      align-items: { value: center }
      flex: { value: 1 1 0, assert: false }
      min-width: { value: "0", assert: false }
      position: { value: relative, assert: false }
      gap: { token: spacing/gap/small, value: 8px }
  leading:
    optional: true
    styles:
      display: { value: flex, assert: false }
      flex-shrink: { value: "0", assert: false }
      width: { token: spacing/size/xsmall, value: 20px }
      height: { token: spacing/size/xsmall, value: 20px }
  text:
    notes: The label over the description.
    styles:
      display: { value: flex, assert: false }
      flex-direction: { value: column, assert: false }
      gap: { token: spacing/gap/3xsmall, value: 2px }
      padding-bottom: { token: spacing/gap/3xsmall, value: 2px }
      min-width: { value: "0", assert: false }
  label:
    styles:
      white-space: { value: nowrap, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/paragraph/font-weight/regular, value: "400" }
      font-size: { token: typography/paragraph/font-size, value: 14px }
      line-height: { token: typography/paragraph/line-height, value: 20px }
      letter-spacing: { token: typography/paragraph/letter-spacing, value: 0px }
  description:
    optional: true
    styles:
      white-space: { value: nowrap, assert: false }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/label/font-weight/regular, value: "400" }
      font-size: { token: typography/placeholder/font-size, value: 10px }
      line-height: { token: typography/placeholder/line-height, value: 12px }
      letter-spacing: { token: typography/placeholder/letter-spacing, value: 0px }
  end:
    notes: "The status dot and the action. Figma calls this layer `left`, although it's on the right."
    optional: true
    styles:
      display: { value: flex, assert: false }
      align-items: { value: center }
      position: { value: relative, assert: false }
      gap: { token: spacing/gap/small, value: 8px }
  badge:
    optional: true
    notes: "Figma's small Badge: an 8px dot in a 24px box."
    styles:
      display: { value: flex, assert: false }
      align-items: { value: center }
      justify-content: { value: center }
      width: { token: spacing/size/small, value: 24px }
      height: { token: spacing/size/small, value: 24px }
  dot:
    optional: true
    styles:
      width: { value: 8px, untokenised: "The small Badge's own 8px dot." }
      height: { value: 8px, untokenised: "The small Badge's own 8px dot." }
      border-radius: { token: spacing/radius/full, value: 10000px }
      background: { token: non-interactive/background/contrast, value: "#ededed" }
  action:
    optional: true
    styles:
      display: { value: flex, assert: false }
      flex-shrink: { value: "0", assert: false }
      width: { token: spacing/size/xsmall, value: 20px }
      height: { token: spacing/size/xsmall, value: 20px }
  focus-ring:
    notes: "Over the whole row, inside it, following the row's 12px corners."
    styles:
      display: { value: none, assert: false }
      position: { value: absolute, assert: false }
      inset: { value: "0", assert: false }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      border-radius: { token: spacing/radius/medium, value: 12px }
      pointer-events: { value: none, assert: false }
