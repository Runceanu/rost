# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: menu
name: Menu
kind: component
status: review
summary: |-
  A navigation item: a label with a line underneath, used in the main nav.
category: navigation
related: [ effect-menu ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "41:259"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=41-259
  extractedAt: "2026-08-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
props:
  title: { type: slot }
  description: { type: slot }
  showDescription: { type: boolean, default: true }
  showDivider: { type: boolean, default: true, notes: "The line underneath. It's Rost's Divider." }
stateSelectors:
  Current: '[aria-current="page"]'
states: [ Default, Hover, Pressed, Focus, Disabled, Current ]
elements:
  root:
    notes: Values come from each state's own branch of the Figma read. The first parse kept Default's colours for every state.
    styles:
      display: { value: flex, assert: false }
      flex-direction: { value: column, assert: false }
      align-items: { value: flex-start }
      position: { value: relative, assert: false }
      gap: { token: spacing/gap/large, value: 24px }
      padding-top: { token: spacing/gap/large, value: 24px }
      text-decoration: { value: none, assert: false, notes: "It's a link." }
      color: { value: inherit, assert: false }
      outline: { value: none, assert: false }
      width:
        value: 324px
        assert: false
        notes: Just the size of the Figma frame. No token, and not something to copy.
  content:
    styles:
      display: { value: flex, assert: false }
      flex-direction: { value: column, assert: false }
      align-items: { value: flex-start }
      width: { value: 100% }
      gap: { token: spacing/gap/small-medium, value: 12px }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      line-height: { token: typography/body/line-height, value: 22px }
      font-size: { token: typography/body/font-size, value: 16px }
      letter-spacing: { token: typography/body/letter-spacing, value: 0px }
  title:
    styles:
      width: { value: 100% }
      font-weight: { token: typography/body/font-weight/medium, value: "500" }
  description:
    styles:
      width: { value: 100% }
      font-weight: { token: typography/body/font-weight/regular, value: "400" }
  divider:
    notes: "Rost's Divider, full width. Figma draws its line on a zero-height frame, half a pixel either side; Divider is one solid pixel, inside the test's tolerance."
    styles:
      width: { value: 100% }
      flex-shrink: { value: "0", assert: false }
  focus-ring:
    styles:
      display: { value: none, assert: false }
      position: { value: absolute }
      inset: { value: "var(--spacing-gap-medium-large) calc(-1 * var(--spacing-gap-2xsmall))", untokenised: "Composed from tokens: around the text only, spacing/gap/medium-large in from the top and bottom, spacing/gap/2xsmall out to each side." }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      border-color: { token: menu/focus-ring, value: "#b6ffda" }
      pointer-events: { value: none, assert: false }
variants:
  - when: { state: Default }
    figmaNode: "41:147"
    elements:
      title:
        color: { token: menu/default/label, value: "#ededed" }
      description:
        color: { token: menu/default/sub-label, value: "#999" }
        font-size: { token: typography/paragraph/font-size, value: 14px, notes: "Figma's code read says typography/body (16px), but its render of this state draws 14px on 20px, exactly paragraph. Probably a variable mode on the frame. I follow what Figma shows." }
        line-height: { token: typography/paragraph/line-height, value: 20px }
  - when: { state: Hover }
    figmaNode: "41:260"
    elements:
      title:
        color: { token: menu/hover/label, value: "#ededed" }
      description:
        color: { token: menu/hover/sub-label, value: "#ededed" }
        font-size: { token: typography/paragraph/font-size, value: 14px }
        line-height: { token: typography/paragraph/line-height, value: 20px }
  - when: { state: Pressed }
    figmaNode: "41:286"
    elements:
      title:
        color: { token: menu/pressed/label, value: "#ededed" }
      description:
        color: { token: menu/pressed/sub-label, value: "#ededed" }
        font-weight: { token: typography/body/font-weight/medium, value: "500" }
        font-size: { token: typography/body/font-size, value: 16px, notes: Pressed is the one state where Figma draws the description at body size. }
        line-height: { token: typography/body/line-height, value: 22px }
  - when: { state: Focus }
    figmaNode: "41:272"
    elements:
      title:
        color: { token: menu/focus/label, value: "#ededed" }
      description:
        color: { token: menu/focus/sub-label, value: "#999" }
        font-size: { token: typography/paragraph/font-size, value: 14px, notes: "Figma's code read says typography/body (16px), but its render of this state draws 14px on 20px, exactly paragraph. Probably a variable mode on the frame. I follow what Figma shows." }
        line-height: { token: typography/paragraph/line-height, value: 20px }
      focus-ring:
        display: { value: block, assert: false }
  - when: { state: Disabled }
    figmaNode: "41:298"
    elements:
      title:
        color: { token: menu/disabled/label, value: "#3a3a3a" }
      description:
        color: { token: menu/disabled/sub-label, value: "#3a3a3a" }
        font-size: { token: typography/paragraph/font-size, value: 14px, notes: "Figma's code read says typography/body (16px), but its render of this state draws 14px on 20px, exactly paragraph. Probably a variable mode on the frame. I follow what Figma shows." }
        line-height: { token: typography/paragraph/line-height, value: 20px }
      root:
        cursor: { value: default, assert: false }
  - when: { state: Current }
    figmaNode: "527:586"
    elements:
      title:
        color: { token: menu/current/label, value: "#ededed" }
      description:
        color: { token: menu/current/sub-label, value: "#ededed", notes: "In Figma since 2026-10-30. The page you're on, set by `aria-current=\"page\"`. It wears Pressed's colour and weight, the way Button's nav wears its pressed look. It keeps the resting size, though: Pressed grows the description to body size, and the current row would come out taller than its neighbours." }
        font-weight: { token: typography/body/font-weight/medium, value: "500" }
        font-size: { token: typography/paragraph/font-size, value: 14px }
        line-height: { token: typography/paragraph/line-height, value: 20px }
      divider:
        background: { token: menu/current/divider, value: "#ededed", notes: "The line under the page you're on is as bright as its text, so the row reads as \"you are here\" at a glance, not only by its weight." }
guidance:
  status: agreed
  use:
    - title: Moving between pages
      text: Moving between the main pages or sections.
      show: state=Current
  avoid:
    - title: Actions
      text: Actions. That's **Button**, menu items take you somewhere.
    - title: The frosted surface
      text: Mixing it up with the **Menu effect** (`effect-menu`), which is the frosted surface the nav sits on.
  behaviour: |-
    Six states. The sixth, `Current`, I added in code first and then in Figma, the page you're on. It comes from `aria-current="page"`, not from the mouse. The description turns bright and medium, as when you press it, and the divider underneath goes as bright as the text.
  accessibility:
    element: "`<a>`, inside `<nav aria-label=\"Main\">` and a list."
    currentPage: |-
      `aria-current="page"`. That's also what the `Current` look is styled from, so there's no prop to keep in step with it.
    focus: "`focus-ring`, on `:focus-visible`."
    mobile: |-
      when it folds behind a button, that button gets `aria-expanded` and controls the list.
  content: "One word: the page's own title."
