# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: divider
name: Divider
kind: component
status: stable
summary: A thin line between things.
category: display
related: [ menu ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "39:111"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=39-111
  extractedAt: "2026-10-19"
  extractedBy: mcp
  frozenAt: "2026-10-20"
elements:
  root:
    styles:
      display: { value: block, assert: false }
      position: { value: relative, assert: false }
      border: { value: none, assert: false, notes: "It's an `<hr>`, and browsers draw one with a border. The line is the background." }
      height: { token: spacing/outline/small, value: 1px }
      background: { token: non-interactive/foreground/quinary, value: "#282828" }
      width:
        value: 104px
        assert: false
        notes: Just the size of the Figma frame. A divider is as wide as what it divides.
implementations:
  portfolio-site:
    component: src/rost/divider/Divider.tsx
    root: .rost-divider
  accounting-app:
    component: src/rost/divider/Divider.tsx
    root: .rost-divider
guidance:
  status: agreed
  use:
    - title: Between groups
      text: Between groups in a list or a menu, when space alone doesn't separate them.
      show: divider
  avoid:
    - title: Between every item
      text: Between every item. Space does that better.
      show: divider
    - title: Holding up a layout
      text: Holding up a layout. If the line goes, the layout should still read.
      show: divider
  behaviour: |-
    One 1px line in `non-interactive/foreground/quinary`, as wide as its container. Figma only has the horizontal one.
  accessibility:
    element: an `<hr>`, so screen readers hear a break. Pass `aria-hidden="true"` when it's only decoration.
  content: None. It's a line.
