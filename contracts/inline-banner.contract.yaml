guidance:
  status: agreed
  use:
    - title: Something to notice
      text: "Telling people something about the page or a section they should notice: saved, offline, open for work, needs your attention."
      show: status=positive, size=medium
    - title: Small or medium
      text: "`Small` in a line of text, `Medium` on its own line or at the top of a section."
      show: status=warning, size=small
  avoid:
    - title: One item's status
      text: The status of one item in a list or table. That's **Badge**, smaller and quieter.
    - title: Asking for a decision
      text: Anything that needs a decision. That's a dialog. A banner tells, it doesn't ask.
      show: status=negative, size=medium
  behaviour: |-
    `status` (`Default`, `Positive`, `Negative`, `Warning`) sets the fill and the icon: plus, check, alarm, warning. You can't interact with it: no hover, no focus.
  accessibility:
    element: |-
      a `<span>` or a `<p>`. If it shows up because of something the person just did, put it in a live region (`role="status"`, or `role="alert"` for `Negative`).
    colour: the icon carries the status, so the status never rests on colour alone.
    glyph: "`aria-hidden=\"true\"`. The label carries the meaning."
  content: |-
    One short sentence, no full stop if it's a fragment. Lead with what happened: "Saved just now", "Payment failed: card expired".
implementations:
  portfolio-site:
    component: src/rost/inline-banner/InlineBanner.tsx
    root: .rost-inline-banner
    deviations:
      - what: |-
          The Roche case study's disclaimer is a whole sentence, so on a narrow screen its label wraps and sits left-aligned instead of staying on one centred line.
        why: |-
          It's a disclaimer, not a status, and it's longer than a phone is wide.
        raisedWithDesign: false
  accounting-app:
    component: src/rost/inline-banner/InlineBanner.tsx
    root: .rost-inline-banner
    deviations:
      - what: |-
          Every banner's label wraps and sits left-aligned on a narrow screen, instead of staying on one centred line.
        why: |-
          Its banners are sentences, a due date and an amount, and on a phone one line ran wider than the screen and widened the whole page.
        raisedWithDesign: false
