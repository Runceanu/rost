# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: dialog
name: Dialog
kind: component
status: review
summary: A question or a short task that stops everything else until it's answered. A grey plate over the page with a title, a few words and its buttons.
category: surfaces
related: [ popover, button, card ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "738:35"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=738-35
  extractedAt: "2026-11-16"
  extractedBy: hand
  frozenAt: "2026-11-16"
props:
  open: { type: boolean, default: false, notes: "Shows it as a modal, with `showModal()`: the page behind can't be reached until it closes." }
  title: { type: slot, required: true, notes: "What it asks or what it's for. It names the dialog." }
  children: { type: slot, notes: "A sentence or two, or a short form." }
  actions: { type: slot, notes: "Its Buttons, the main one last. Esc closes it too, and calls `onClose`." }
elements:
  root:
    notes: "The browser's `<dialog>`, with its own look taken away. The browser shows and hides it, and centres it, so the plate is a part inside it."
    styles:
      padding: { token: spacing/gap/none, value: 0px }
      border: { value: none, assert: false }
      background: { value: transparent, assert: false }
      overflow: { value: visible, assert: false }
      max-width: { value: none, assert: false }
      margin: { value: auto, assert: false, notes: "The browser centres a modal dialog with its margins; Rost's reset would take them away." }
      color: { value: inherit, assert: false }
  backdrop:
    pseudo: "::backdrop"
    notes: "The layer the browser puts between the dialog and the page. The page's own colour at 72%, so the page stays in view but steps back."
    styles:
      background: { token: dialog/backdrop, value: "#060805" }
      opacity: { token: opacity/hard, value: "0.72" }
  panel:
    notes: "The plate: the dialog's fill, a 1px edge and the floating shadow. It holds the title, the words and the buttons in a column, 16px apart."
    styles:
      display: { value: flex, assert: false }
      flex-direction: { value: column, assert: false }
      gap: { token: spacing/gap/medium, value: 16px }
      width: { value: 400px, notes: "Wide enough for two lines of words and two buttons. On a phone it's as wide as the screen allows." }
      max-width: { value: calc(100vw - 32px), assert: false }
      padding: { token: spacing/gap/large, value: 24px }
      border-radius: { token: spacing/radius/xlarge, value: 24px }
      background: { token: dialog/background, value: "#171717" }
      outline-style: { value: solid, assert: false }
      outline-width: { token: spacing/outline/small, value: 1px }
      outline-offset: { value: "calc(-1 * var(--spacing-outline-small))", untokenised: "Composed from a token: the edge sits inside the plate." }
      outline-color: { token: dialog/edge, value: "#3a3a3a" }
      box-shadow: { token: shadow/floating, value: "0px 16px 24px 0px rgba(0, 0, 0, 0.16)", notes: "The kit's only drop shadow, for things that float above the page." }
  title:
    notes: "An `<h2>` in title type, medium weight."
    styles:
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/title/font-weight/medium, value: "500" }
      font-size: { token: typography/title/font-size, value: 24px }
      line-height: { token: typography/title/line-height, value: 32px }
      letter-spacing: { token: typography/title/letter-spacing, value: 0px }
      color: { token: dialog/title, value: "#ededed" }
  body:
    notes: Paragraph type, a step quieter than the title.
    styles:
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/paragraph/font-weight/regular, value: "400" }
      font-size: { token: typography/paragraph/font-size, value: 14px }
      line-height: { token: typography/paragraph/line-height, value: 20px }
      letter-spacing: { token: typography/paragraph/letter-spacing, value: 0px }
      color: { token: dialog/body, value: "#d3d9d5" }
  actions:
    notes: "The Buttons, in a row on the right, 8px apart. The main one goes last, where the eye ends up."
    styles:
      display: { value: flex, assert: false }
      justify-content: { value: flex-end }
      gap: { token: spacing/gap/small, value: 8px }
guidance:
  status: proposed
  use:
    - title: Before something you can't undo
      text: "Deleting an invoice, closing a year. Say what will happen in the title, and put it on the main button too."
    - title: A short task
      text: "Two or three fields that belong to the screen behind, like renaming a client."
  avoid:
    - title: News
      text: "Telling someone something happened. That's **Toast**: it doesn't stop them."
    - title: More detail
      text: "Extra detail next to something. That's **Popover**, or **Disclosure** in the page."
    - title: Long forms
      text: "Anything that scrolls. Give it a page."
  behaviour: |-
    It opens as a modal: focus moves into it, the page behind can't be reached, and Esc closes it. That's the browser's `<dialog>` doing the work, not mine. The plate is Card's grey with an edge and the floating shadow. Behind it, the page dims to 72% of its own colour: the contract styles the browser's `::backdrop` as a part of its own.
  accessibility:
    element: "`<dialog>` opened with `showModal()`, labelled by its title (`aria-labelledby`)."
    name: "The title."
    keyboard: "Focus starts on the first thing you can press in it and stays inside until it closes. Esc closes it. Put the safe choice first, so a stray Enter doesn't delete anything."
    focus: "When it closes, focus goes back to what opened it. The browser does that too."
    colour: "The title is 14:1 and the words 11:1 on the plate, in dark."
  content: "The title asks the question (\"Delete this invoice?\"). The buttons answer it with verbs (\"Keep it\", \"Delete\"), never \"Yes\" and \"No\"."
