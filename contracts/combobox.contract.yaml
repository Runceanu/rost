# yaml-language-server: $schema=../schema/component-contract.schema.json
schemaVersion: 2
id: combobox
name: Combobox
kind: component
status: review
summary: "One choice from a long list, found by typing. Select's field you can type in, and the matching options in a list under it."
category: inputs
related: [ combobox-option, select, input, dropdown-menu ]
source:
  tool: figma
  fileKey: 1Zy0wiWKXQAvsfDBX3KR0d
  nodeId: "756:58"
  url: https://www.figma.com/design/1Zy0wiWKXQAvsfDBX3KR0d/UI-Kit-v01?node-id=756-58
  extractedAt: "2026-11-17"
  extractedBy: hand
  frozenAt: "2026-11-17"
props:
  label: { type: slot, required: true, notes: "The field's name, small at the top, as Select's is." }
  options: { type: node, required: true, notes: "`{ value, label }`, in the order to show them." }
  value: { type: string, notes: "The picked option's `value`, or nothing." }
  placeholder: { type: string, notes: "What the empty field says once it has the focus." }
  empty: { type: string, default: No match, notes: "What the list says when nothing matches." }
  supportive: { type: slot, notes: "One line under the field: help, or what to fix when `error` is on." }
  error: { type: boolean, default: false, notes: "Select's red." }
states: [ Default, Hover, Focus, Disabled ]
stateSelectors:
  Focus: ":has(> .rost-combobox__field:focus-visible)"
  Disabled: ":has(> .rost-combobox__field:disabled)"
elements:
  root:
    notes: "A box the size of Input, holding the parts, exactly as Select's. The input covers all of it, so a press anywhere puts the caret in it and opens the list."
    styles:
      display: { value: block, assert: false }
      position: { value: relative, assert: false }
      height: { token: spacing/size/large, value: 56px }
      width: { value: 208px, notes: "Just the size of the Figma frame, as Input's is. A field is as wide as its form." }
  outline:
    notes: "The field's fill and its 1px edge, on their own layer, as Input has them."
    styles:
      position: { value: absolute }
      inset: { value: "0" }
      border-style: { value: solid }
      border-width: { token: spacing/outline/small, value: 1px }
      border-radius: { token: spacing/radius/medium, value: 12px }
      pointer-events: { value: none, assert: false }
  label:
    notes: "Select's label: placeholder type, 12px in from the edges. A `<label>` for the input."
    styles:
      position: { value: absolute }
      top: { token: spacing/gap/small-medium, value: 12px }
      left: { token: spacing/gap/small-medium, value: 12px }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/label/font-weight/regular, value: "400" }
      font-size: { token: typography/placeholder/font-size, value: 10px }
      line-height: { token: typography/placeholder/line-height, value: 12px }
      letter-spacing: { token: typography/placeholder/letter-spacing, value: 0px }
      pointer-events: { value: none, assert: false }
  field:
    notes: "An `<input role=\"combobox\">` over the whole box. What you type, or the picked option, sits where Select shows its value."
    styles:
      box-sizing: { value: border-box, assert: false }
      width: { value: 100%, assert: false }
      cursor: { value: text, assert: false }
      position: { value: absolute }
      inset: { value: "0" }
      appearance: { value: none, assert: false }
      background: { value: transparent, assert: false }
      border: { value: none, assert: false }
      outline: { value: none, assert: false }
      padding-top: { token: spacing/gap/large, value: 24px, notes: "The label's 12px and its 12px line above the value." }
      padding-bottom: { token: spacing/gap/small-medium, value: 12px }
      padding-left: { token: spacing/gap/small-medium, value: 12px }
      padding-right: { token: spacing/size/medium, value: 40px, notes: "Room for the chevron and the 12px after it." }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/paragraph/font-weight/regular, value: "400" }
      font-size: { token: typography/paragraph/font-size, value: 14px }
      line-height: { token: typography/paragraph/line-height, value: 20px }
      letter-spacing: { token: typography/paragraph/letter-spacing, value: 0px }
  chevron:
    notes: "Rost's chevron-down, 20px, drawn as a mask in Input's icon colour, 12px from the right edge."
    styles:
      position: { value: absolute }
      top: { token: spacing/gap/medium-large, value: 20px, notes: "Centres the 20px chevron on the value line." }
      right: { token: spacing/gap/small-medium, value: 12px }
      width: { token: spacing/size/xsmall, value: 20px }
      height: { token: spacing/size/xsmall, value: 20px }
      mask: { value: url(./icon-chevron.svg) center / contain no-repeat, untokenised: The icon file itself. }
      pointer-events: { value: none, assert: false }
  supportive:
    notes: "Input's help line, 4px under the field. It sits outside the field's box, so it doesn't change the field's height."
    styles:
      position: { value: absolute }
      left: { token: spacing/gap/small-medium, value: 12px }
      top: { value: "calc(var(--spacing-size-large) + var(--spacing-gap-2xsmall))", untokenised: "Composed from tokens: the field's height plus spacing/gap/2xsmall." }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/label/font-weight/medium, value: "500" }
      font-size: { token: typography/placeholder/font-size, value: 10px }
      line-height: { token: typography/placeholder/line-height, value: 12px }
      letter-spacing: { token: typography/placeholder/letter-spacing, value: 0px }
      white-space: { value: nowrap, assert: false }
  focus-ring:
    notes: Input's ring, 4px outside the field.
    styles:
      display: { value: none, assert: false }
      position: { value: absolute }
      inset: { value: "calc(-1 * var(--spacing-gap-2xsmall))", untokenised: "Composed from a token: the ring sits spacing/gap/2xsmall outside the field." }
      border-style: { value: solid }
      border-width: { token: spacing/outline/medium, value: 2px }
      border-radius: { token: spacing/radius/large, value: 16px }
      pointer-events: { value: none, assert: false }
  listbox:
    notes: "`role=\"listbox\"`, a popover under the field, 8px away and at least as wide as it. DropdownMenu's plate: 4px inside, Popover's grey, edge and shadow."
    styles:
      inset: { value: auto, assert: false }
      margin: { token: spacing/gap/none, value: 0px }
      margin-block-start: { token: spacing/gap/small, value: 8px }
      position-area: { value: block-end span-inline-end, assert: false }
      position-try-fallbacks: { value: flip-block, assert: false }
      min-width: { value: anchor-size(width), assert: false, notes: "As wide as the field it opens from." }
      max-height: { value: 240px, notes: "Six options; more scroll." }
      overflow-y: { value: auto, assert: false }
      padding: { token: spacing/gap/2xsmall, value: 4px }
      border: { value: none, assert: false }
      border-radius: { token: spacing/radius/medium, value: 12px }
      background: { token: combobox/listbox/background, value: "#171717" }
      outline-style: { value: solid, assert: false }
      outline-width: { token: spacing/outline/small, value: 1px }
      outline-offset: { value: "calc(-1 * var(--spacing-outline-small))", untokenised: "Composed from a token: the edge sits inside the plate." }
      outline-color: { token: combobox/listbox/edge, value: "#3a3a3a" }
      box-shadow: { token: shadow/floating, value: "0px 16px 24px 0px rgba(0, 0, 0, 0.16)" }
      color: { value: inherit, assert: false }
  empty:
    optional: true
    notes: "When nothing matches: one 40px row in paragraph type and the tertiary grey."
    styles:
      display: { value: flex, assert: false }
      align-items: { value: center }
      height: { token: spacing/size/medium, value: 40px }
      padding-left: { token: spacing/gap/small-medium, value: 12px }
      font-family: { token: font-family/base, value: "'General Sans Variable'" }
      font-weight: { token: typography/paragraph/font-weight/regular, value: "400" }
      font-size: { token: typography/paragraph/font-size, value: 14px }
      line-height: { token: typography/paragraph/line-height, value: 20px }
      letter-spacing: { token: typography/paragraph/letter-spacing, value: 0px }
      color: { token: combobox/empty, value: "#999999" }
